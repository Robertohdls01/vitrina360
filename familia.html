<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:600 18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b2140;background:radial-gradient(120% 80% at 50% 0%,#fff6fa 0%,#fde7ef 45%,#f6dcf0 100%);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.top{display:flex;gap:6px;align-items:center;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none;min-height:52px}

.chip.top1{background:linear-gradient(90deg,#fff3c4,#ffe08a)}
.escena{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
#burb{background:#fff;border-radius:26px 26px 26px 8px;padding:16px 18px;margin:0 16px 8px;box-shadow:0 10px 30px rgba(120,40,90,.15);font-size:20px;max-width:520px;width:calc(100% - 32px);text-align:center;min-height:64px}
#burb small{display:block;font-size:14px;color:#8a6b80;font-weight:600;margin-top:4px}
#burb .reloj{font:900 46px system-ui;color:#e2457f;letter-spacing:1px}

#pan .tit{font-size:17px;color:#a0346a;margin-top:4px}
#pan .lee{font:500 17px/1.5 system-ui;color:#2b2140;text-align:left;width:100%}
.con-pan #fla{height:min(26vh,230px);width:min(44vw,200px)}
.menu{display:flex;justify-content:space-around;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 14px rgba(120,40,90,.1);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

.acc{padding-bottom:10px}
#grupo{position:relative;display:flex;align-items:flex-end;justify-content:center;width:100%;max-width:520px}
.mini{position:relative;width:min(19vw,92px);height:min(16vh,120px);margin:0 -4px;display:flex;flex-direction:column;align-items:center;animation:vive 2.6s ease-in-out infinite;cursor:pointer;transition:transform .5s}
.mini svg{width:100%;height:100%;filter:drop-shadow(0 8px 10px rgba(120,40,90,.22))}
.mini .nm{position:absolute;bottom:-14px;font-size:12px;color:#8a6b80;white-space:nowrap;background:#fff;border-radius:999px;padding:1px 8px;box-shadow:0 2px 6px rgba(160,52,106,.12)}
.mini .em{position:absolute;top:18%;right:-2px;font-size:20px}
.mini.habla{animation:habla .22s ease-in-out infinite alternate}
.mini.mira-d{transform:rotate(8deg)}.mini.mira-i{transform:rotate(-8deg)}
.globo{position:absolute;bottom:100%;left:50%;transform:translateX(-50%) scale(0);transform-origin:bottom center;background:#fff;border-radius:16px 16px 16px 4px;padding:6px 10px;font-size:14px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;box-shadow:0 6px 14px rgba(120,40,90,.18);transition:transform .25s;z-index:5}
.globo.ve{transform:translateX(-50%) scale(1)}
#grupo #fla{margin:0 4px}
.vuela{position:fixed;font-size:34px;z-index:60;pointer-events:none;transition:left .9s ease-in-out,top .9s cubic-bezier(.3,-0.6,.7,1),transform .9s}
body.encuarto{background:radial-gradient(120% 80% at 50% 0%,#f2f7ff 0%,#dfe9fb 50%,#d4dcf3 100%)}
.cuarto-esc{position:absolute;inset:auto 0 0 0;height:46%;pointer-events:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 6% 2%;font-size:min(13vw,64px);opacity:.9}
.puerta{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#7a6f96;margin:0 2px;cursor:pointer}.puerta b{font-size:min(10vw,48px);line-height:1}
.pie{position:absolute;bottom:62px;left:0;right:0;text-align:center;font-size:11px;color:#b48aa2;pointer-events:none}
</style>

const FL_SVG = () => FL_BASE + FL_LOOKS.normal + '</svg>';
const TONOS = [0, 300, 160, 200, 30, 260, 110, 330];
const tono = id => { const i = F ? F.miembros.findIndex(m => m.id === id) : 0; return TONOS[Math.max(0, i) % TONOS.length]; };
function miniHTML(m){ return `<div class="mini" data-id="${m.id}"><div class="globo"></div>${FL_SVG().replace('<svg ', `<svg style="filter:hue-rotate(${tono(m.id)}deg)" `)}<span class="em">${m.emoji}</span><span class="nm">${esc(m.nombre)}</span></div>`; }
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);

let F = null, YO = null, voz = false, vistos = new Set(JSON.parse(localStorage.getItem('famVistos') || '[]')), cola = [], actual = null, reloj = null;

// ---------- voz de Flashy ----------
function decir(txt){
  if(!voz || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(txt).replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, '')); u.lang = 'es-AR';
    const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang)); const v = vs.find(v => /google|natural|online/i.test(v.name)) || vs[0]; if(v) u.voice = v;

function lluvia(emo, n){ for(let i = 0; i < (n || 26); i++){ const d = document.createElement('div'); d.className = 'lluvia'; d.textContent = emo; d.style.left = Math.random() * 100 + 'vw'; d.style.fontSize = (28 + Math.random() * 40) + 'px'; d.style.setProperty('--d', (2.4 + Math.random() * 2) + 's'); d.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg'); d.style.animationDelay = Math.random() * 1.2 + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 5200); } }

// ---------- pantalla ----------

function grupoHTML(){ const yo = `<div id="fla" ${YO ? `style="--t:${tono(YO.id)}deg"` : ''}><div class="globo"></div>${FL_SVG()}<div class="humo i" hidden></div><div class="humo d" hidden></div></div>`;
  if(!F || !YO) return yo; if(YO.cuarto){ const c = CUARTOS[YO.cuarto] || CUARTOS.solo; return `<div class="cuarto-esc"><span>${c[2]}</span><span>${c[0]}</span></div>` + yo; }
  const priv = F.miembros.filter(m => m.id !== YO.id && m.cuarto), otros = F.miembros.filter(m => m.id !== YO.id && !m.cuarto), izq = otros.filter((_, i) => i % 2), der = otros.filter((_, i) => !(i % 2));
  return izq.map(miniHTML).join('') + yo + der.map(miniHTML).join('') + (priv.length ? `<div style="position:absolute;top:-34px;right:4px;display:flex">${priv.map(puertaHTML).join('')}</div>` : ''); }
function globo(id, txt, ms){ const el = id === (YO && YO.id) ? $('#fla') : document.querySelector(`.mini[data-id="${id}"]`); if(!el) return; const g = el.querySelector('.globo'); g.textContent = txt; g.classList.add('ve'); el.classList.add('habla'); clearTimeout(el._t); el._t = setTimeout(() => { g.classList.remove('ve'); el.classList.remove('habla'); }, ms || 2600); }
function volar(desde, hasta, emo){ return new Promise(ok => { const a = desde === (YO && YO.id) ? $('#fla') : document.querySelector(`.mini[data-id="${desde}"]`), destinos = hasta === 'todos' ? [...document.querySelectorAll('.mini')] : [document.querySelector(`.mini[data-id="${hasta}"]`) || document.querySelector(`.puerta[data-id="${hasta}"]`) || $("#fla")];
  if(!a || !destinos[0]) return ok(); const r = a.getBoundingClientRect();
  destinos.forEach(b => { const d = document.createElement('div'); d.className = 'vuela'; d.textContent = emo; d.style.left = (r.left + r.width / 2 - 17) + 'px'; d.style.top = (r.top + 10) + 'px'; document.body.appendChild(d);
    const q = b.getBoundingClientRect(); b.classList.add(q.left < r.left ? 'mira-d' : 'mira-i'); requestAnimationFrame(() => requestAnimationFrame(() => { d.style.left = (q.left + q.width / 2 - 17) + 'px'; d.style.top = (q.top + 10) + 'px'; d.style.transform = 'scale(.7) rotate(20deg)'; }));
    setTimeout(() => { d.remove(); b.classList.remove('mira-d', 'mira-i'); }, 1000); });
  setTimeout(ok, 1000); }); }
// charla de fondo entre los Flashys

  escena(`${L.length} tarea${L.length > 1 ? 's' : ''} pendiente${L.length > 1 ? 's' : ''}`, '', L.map(a => [`${esPadre() ? (a.para === 'todos' ? '👨‍👩‍👧' : nom(a.para)) + ': ' : ''}${esc(a.texto).slice(0, 28)} ${'⭐'.repeat(a.estrellas || 1)}`, () => esPadre() ? revisar() : resp(a, 'listo'), esPadre() ? '' : 'ok'])); }
function hablar(){ aQuien(para => pedir(`¿Qué le digo a ${esc(nom(para))}?`, 'Escribí el mensaje', texto => enviar({tipo: 'aviso', texto, para})), true); }
function familia(){ escena(`🏠 ${esc(F.familia)}`, F.miembros.map(m => `${m.emoji} ${esc(m.nombre)}${m.rol === 'padre' ? ' (mamá/papá)' : ' ⭐' + (m.estrellas || 0)}${m.cuarto ? ' · 🚪 ' + (CUARTOS[m.cuarto] || CUARTOS.solo)[1] : ''}`).join('<br>'), [['➕ Sumar a alguien', () => invitar('', false), 'pri'], ['🌸 Mandar una flor', () => aQuien(p => enviar({tipo: 'flor', para: p}), true)]]); }

// ---------- arranque y novedades ----------
async function arrancar(){
  if(!S) return inicio();
  try{ await cargar(); principal(true); }catch(e){ return inicio(); }
  setInterval(async () => { if(document.hidden) return; try{ await cargar(); pintarTop(); if(!actual && !$('#in') && nuevos().length) mostrar(nuevos()[0]); }catch(e){} }, 6000);
}
if('speechSynthesis' in window) speechSynthesis.getVoices();
arrancar();
