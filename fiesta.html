  if (FL || !F || F.vivo || PREV || !document.querySelector('.hero')) return; FL = true;
  $('#flav').innerHTML = flCorazon() ? flSVGc() : flSVG(F.flLook || 'traje'); $('#fl').classList.add('on', 'tapa'); flEscena();
  const info = () => {
    const n = INV && INV.nombre && !INV.anon ? ' ' + String(INV.nombre).split(' ')[0] : '';
    let x = t('¡Hola{n}! Te cuento de la invitación:', {n}) + ' ' + nomFiesta(F) + (F.fecha ? ', ' + fechaLarga(F) : '') + (F.hora ? ' · ' + F.hora + ' h' : '') + (F.salon ? ', ' + F.salon : '') + '.';
    if (F.vestimenta) x += ' ' + t('Vestimenta') + ': ' + F.vestimenta + '.';
    const ops = [{t: '✅ ' + t('Confirmar asistencia'), f: () => { $('#flb').classList.remove('on'); const r = document.getElementById('rsvp'); if (r) r.scrollIntoView({behavior: 'smooth', block: 'center'}); }}];
    if (F.salon || F.direccion) ops.push({t: '📍 ' + t('Cómo llegar'), alt: true, f: () => window.open(mapa(F), '_blank')});
    if (F.regalo) ops.push({t: '🎁 ' + t('Regalo'), alt: true, f: () => flDecir(F.regalo, [{t: '✅ ' + t('Confirmar asistencia'), f: ops[0].f}])});
    flDecir(x, ops);
  };
  $('#flav').onclick = () => { flVoz = true; $('#flb').classList.contains('on') ? $('#flb').classList.remove('on') : info(); };
  let visto = 0; try { visto = +localStorage.getItem('flinv_' + CODE) || 0; localStorage.setItem('flinv_' + CODE, '1'); } catch (e) {}
  if (!visto) flLuego(() => setTimeout(() => { if (!document.getElementById('sobre')) info(); }, 700));
}
function arrancarVivo() { flashy(); flInvitacion(); clearInterval(vivoTimer); if (F && F.vivo && F.hoy && INV && !PREV) { vivoTick(); vivoTimer = setInterval(vivoTick, 7000); } }
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function guardar() {
  const el = $('#guardar'); if (!el) return;
  if (F.abierto) { el.innerHTML = instalada() ? `<h3>${esc(F.nombre || '')}</h3><p>${t('✅ Ya lo tenés en tu celular. Abrilo desde el ícono cada vez que vengas.')}</p>` : `<h3>${t('Guardalo en tu celular')}</h3><p>${t('Tené {n} en tu celular: pedís a la barra sin fila, te enterás de lo que viene y guardás los recuerdos de cada noche.', {n: '<b>' + esc(F.nombre || '') + '</b>'})}</p><button class="btn big2" id="inst">${t('📲 Guardar en mi celular')}</button>`; const ib = $('#inst'); if (ib) ib.onclick = instalar; return; }
  if (instalada()) { el.innerHTML = `<h3>${t('Tu fiesta')}</h3><p>${t('✅ Ya tenés la fiesta guardada en tu celular.')}</p><p>${t('🔔 El día de la fiesta abrila desde el ícono, <b>activá los avisos</b> y dejá el celular con sonido o vibración: te vamos a avisar de la comida, el vals y la torta.')}</p>`; return; }
  el.innerHTML = `<h3>${t('Guardala en tu celular')}</h3><p>${t('<b>Guardala en tu celular y dejá todo activado para que el día de la fiesta no te pierdas nada.</b> Desde acá te vamos a avisar cuándo sale la comida, cuándo es el vals y la torta, aunque estés afuera.')}</p><button class="btn big2" id="inst">${t('📲 Guardar la fiesta en mi celular')}</button><p style="font-size:15px;margin-top:12px">${t('🔔 El día de la fiesta: abrila, <b>activá los avisos</b> y dejá el celular con sonido o vibración.')}</p>`;
  $('#inst').onclick = instalar;
}
async function instalar() {
  if (PREV) return;
  if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; return; }
  const ios = esIOS();
  $('#modalIn').innerHTML = `<h3 style="margin:0 0 6px">${t('📲 Guardar la fiesta')}</h3><ol>${(ios ? ['Tocá el botón <b>Compartir</b> <span style="font-size:20px">⬆️</span> (abajo en Safari).', 'Elegí <b>“Agregar a inicio”</b>.', 'Tocá <b>Agregar</b>. ¡Listo! Te queda el ícono de la fiesta.'] : ['Tocá el menú <b>⋮</b> arriba a la derecha.', 'Elegí <b>“Agregar a la pantalla principal”</b> o <b>“Instalar”</b>.', 'Confirmá. ¡Listo! Te queda el ícono de la fiesta.']).map(x => `<li>${t(x)}</li>`).join('')}</ol><button class="btn big2" id="cerrar">${t('Entendido')}</button>`;
  $('#modal').classList.add('on'); $('#cerrar').onclick = () => $('#modal').classList.remove('on');
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
document.addEventListener('click', e => { const b = e.target.closest('[data-copiar]'); if (!b) return; navigator.clipboard && navigator.clipboard.writeText(b.dataset.copiar).then(() => { b.textContent = t('✅ Copiado'); setTimeout(() => b.textContent = t('📋 Copiar'), 1800); }); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.currentTarget.classList.remove('on'); });

// ===== Boliche / bar / peña: el cliente pone su nombre y pide a la barra =====
const LSC = 'fiestaCli:' + (location.pathname.split('/')[2] || '');
function cliAbierto() { try { const c = JSON.parse(localStorage.getItem(LSC) || 'null'); if (c && c.cid && c.nombre) { TOK = 'c:' + c.cid; INV = {id: 'c_' + c.cid, nombre: c.nombre, mesa: MESA || '', anon: true}; } } catch (e) {} }
function entrarAbierto(nombre) { nombre = String(nombre || '').trim().slice(0, 40); if (!nombre) return; const cid = Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, '0')).join('');
  try { localStorage.setItem(LSC, JSON.stringify({cid, nombre})); } catch (e) {} TOK = 'c:' + cid; INV = {id: 'c_' + cid, nombre, mesa: MESA || '', anon: true}; render(); arrancarVivo(); if (!instalada()) ofrecerLogo(); else if (FL) flMenu(); }
function ofrecerLogo() { const c = $('#capa'); c.innerHTML = `<div style="max-width:460px;margin:12vh auto 0;background:var(--card);border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)"><div style="font-size:52px">📲</div><h2>${t('¿Querés guardar {n} en tu celular?', {n: esc(F.nombre || '')})}</h2><p>${t('Te queda el logo en la pantalla: la próxima vez lo abrís directo para pedir a la barra y ver tus recuerdos.')}</p><button class="btn big2" id="olSi">${t('📲 Sí, guardar')}</button><br><button class="btn no" id="olNo">${t('Ahora no')}</button></div>`; c.classList.add('on');
  $('#olSi').onclick = () => { cerrarCapa(); instalar(); }; $('#olNo').onclick = () => { cerrarCapa(); if (FL) flMenu(); }; }
const numP = p => '#' + (p.id % 1000);
// Muestra: el que entra desde una publicación prueba la fiesta con su propio nombre.
function nombreDemo() {
  const c = $('#capa'); c.innerHTML = `<div style="max-width:440px;margin:14vh auto 0;background:var(--card);border-radius:22px;padding:22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)"><div style="font-size:48px">👋</div><h2 style="margin:6px 0">${t('Probá la fiesta como invitado')}</h2><p>${t('Escribí tu nombre y mirá cómo te acompaña Flashy en la fiesta.')}</p><input id="dnIn" maxlength="30" placeholder="${t('Tu nombre')}" style="width:100%;box-sizing:border-box;font:18px var(--sans);padding:12px;border-radius:12px;border:1.5px solid var(--line);margin:6px 0 10px"><button class="btn big2" id="dnOk">${t('🎉 Entrar a la fiesta')}</button></div>`;
  c.classList.add('on'); setTimeout(() => { const i = $('#dnIn'); if (i) i.focus(); }, 100);
  const ok = () => { const n = ($('#dnIn').value || '').trim().replace(/\s+/g, ' ').slice(0, 30) || 'Roberto'; try { localStorage.setItem('demoNom', n); } catch (e) {} INV.nombre = n; cerrarCapa(); render(); arrancarVivo(); };
  $('#dnOk').onclick = ok; $('#dnIn').onkeydown = e => { if (e.key === 'Enter') ok(); };
}
async function cargar() {
  try {
    const r = await fetch('/api/fiesta?accion=ver&f=' + encodeURIComponent(CODE) + (TOK ? '&i=' + encodeURIComponent(TOK) : ''));
    const j = await r.json(); if (!r.ok) throw new Error(j.error || t('No encontramos esta fiesta.'));
    F = j.fiesta; INV = j.inv || null; if (F.abierto && !INV) cliAbierto();
    if (CODE === 'DEMO15' && TOK === 'demoroberto' && INV) { let dn = ''; try { dn = localStorage.getItem('demoNom') || ''; } catch (e) {} if (dn) INV.nombre = dn; else { render(); return nombreDemo(); } }
    render(); arrancarVivo();
    if (P.get('album') === '1') verAlbum(P.get('k') ? '&k=' + encodeURIComponent(P.get('k')) : P.get('p') ? '&p=' + encodeURIComponent(P.get('p')) : null);
    if (P.get('firmas') === '1') verCuadro(false, P.get('k') ? '&k=' + encodeURIComponent(P.get('k')) : P.get('p') ? '&p=' + encodeURIComponent(P.get('p')) : null);
  } catch (e) { $('#app').innerHTML = `<div class="carga">😕 ${esc(e.message)}</div>`; }
}
if (PREV) {
  addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.tipo !== 'fiesta-prev') return; F = e.data.fiesta; render(); });
  parent.postMessage({tipo: 'fiesta-prev-listo'}, location.origin);
} else if (!CODE) { $('#app').innerHTML = `<div class="carga">${t('Falta el link de la fiesta.')}</div>`; }
else {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = '/api/fiesta?manifest=' + encodeURIComponent(CODE); document.head.appendChild(l);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  cargar();
}
if (!PREV) I18N.boton();
</script>
</body>
