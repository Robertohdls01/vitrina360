<style>
:root{--ac:#c9a227;--bg:#fbf7f0;--card:#fffdf8;--ink:#2e2414;--soft:#6b5b45;--line:#eadfcb;--script:'Great Vibes',cursive;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{font:17px/1.5 var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
body.t-flores{--bg:#fbf1f3;--card:#fffafb;--ink:#3f2630;--soft:#7a5562;--line:#f1d9df}
body.t-brillos{--bg:#1d1b2f;--card:#26243c;--ink:#f7f0e2;--soft:#cfc6b3;--line:#3a3756}
body.t-moderna{--bg:#f5f5f2;--card:#fff;--ink:#1f2937;--soft:#4b5563;--line:#e5e7eb;--script:'Figtree',system-ui,sans-serif}
body.t-mariposas{--bg:#f3effa;--card:#fdfbff;--ink:#33284d;--soft:#64587f;--line:#e2daf2}
body.t-luna{--bg:#1c2440;--card:#252f52;--ink:#eef1fa;--soft:#c3cae0;--line:#37426b}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px;position:relative}
.deco{position:absolute;left:0;right:0;top:0;height:220px;pointer-events:none;overflow:hidden;opacity:.9}
.deco svg{width:100%;height:100%}
.hero{text-align:center;padding:38px 8px 10px;position:relative}
.foto{width:210px;height:210px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;border:6px solid var(--card);box-shadow:0 0 0 3px var(--ac),0 14px 34px rgba(0,0,0,.18)}
.tit{font:700 15px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--ac)}
.nom{font:400 76px/1.05 var(--script);margin:10px 0 6px;color:var(--ink);word-break:break-word}
body.t-moderna .nom{font-weight:800;font-size:54px;letter-spacing:-.02em}
.frase{font:italic 500 21px/1.4 var(--serif);color:var(--soft);max-width:420px;margin:8px auto 0}
.sep{width:120px;height:2px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
.cuenta{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.cuenta div{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:68px;padding:10px 6px;text-align:center}
.cuenta b{display:block;font:800 28px/1 var(--sans);color:var(--ink)}.cuenta small{font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.falta{text-align:center;color:var(--soft);font-size:15px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;margin:16px 0;box-shadow:0 6px 22px rgba(0,0,0,.05);text-align:center}
.card h3{font:700 13px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ac);margin:0 0 10px}
.card .big{font:700 24px/1.25 var(--serif);margin:0}
body.t-moderna .card .big{font-family:var(--sans);font-weight:800;font-size:21px}
.card p{margin:6px 0;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font:700 16px var(--sans);cursor:pointer;text-decoration:none;background:var(--ac);color:#fff;margin:6px 4px 0;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.no{background:#f3f4f6;color:#374151}
body.t-brillos .btn.no,body.t-luna .btn.no{background:#3a3756;color:#f7f0e2}
.btn:disabled{opacity:.6}
.big2{font-size:19px;padding:16px 28px;width:100%;max-width:340px}
.rsvp label{display:block;text-align:left;font-weight:600;margin:14px 0 6px;color:var(--ink)}
.rsvp select,.rsvp textarea,.rsvp input{width:100%;font:17px var(--sans);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.rsvp textarea{min-height:76px;resize:vertical}
.hola{font:700 22px/1.3 var(--sans);margin:0 0 4px}
.ok{background:rgba(34,197,94,.12);border-radius:14px;padding:14px;margin-top:10px;color:var(--ink)}
.mesa{display:inline-block;margin-top:8px;background:var(--ac);color:#fff;font:800 22px var(--sans);padding:8px 18px;border-radius:12px}
.res button{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font:600 17px var(--sans);color:var(--ink);cursor:pointer}
.copiar{font:600 15px var(--sans)}
.pie{text-align:center;font-size:13px;color:var(--soft);margin-top:26px;line-height:1.6}
.pie a{color:var(--soft)}
.banner{background:#fff4d6;color:#5b4410;border-radius:14px;padding:12px 14px;font-size:15px;text-align:center;margin-bottom:6px}
.banner a{color:#5b4410;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9;padding:12px}
.modal.on{display:flex}
.modal .in{background:#fff;color:#1f2937;border-radius:22px;max-width:440px;width:100%;padding:22px 20px;font-size:17px}
.modal .in ol{padding-left:22px;margin:10px 0}.modal .in li{margin:8px 0}
.err{color:#b91c1c;font-weight:600;margin-top:8px}
.carga{text-align:center;padding:90px 20px;color:#6b5b45}
.linkmode .hero{padding-top:18px}
.vivo{text-align:left}.vivo h3{text-align:center}
.mesaG{text-align:center;margin:4px 0 10px}.mesaG .mesa{font-size:30px;padding:10px 26px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:18px}
.item:last-child{border-bottom:0}.qty{display:flex;align-items:center;gap:8px}
.qty button{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:800 22px var(--sans);cursor:pointer}
.qty b{min-width:22px;text-align:center;font-size:20px}
.ped{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:16px}
.ped .est{font-weight:800;font-size:17px}
.prog{margin:10px 0 4px}.prog summary{font-weight:700;cursor:pointer;padding:6px 0}.prog .it{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px}.prog .it b{min-width:50px}.prog .ya{opacity:.5}.prog .ahora{font-weight:800;color:var(--ac)}
.prox{background:var(--bg);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:16px}
.toast{position:fixed;left:12px;right:12px;top:12px;z-index:20;background:var(--ac);color:#fff;border-radius:18px;padding:16px 18px;font:700 20px/1.35 var(--sans);box-shadow:0 12px 30px rgba(0,0,0,.3);display:none}
.toast.on{display:block;animation:baja .35s ease}.toast small{display:block;font:500 14px var(--sans);opacity:.9;margin-top:6px}
#fl{position:fixed;right:10px;bottom:12px;z-index:15;display:none;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 20px)}
#fl.on{display:flex}
#flav{width:74px;height:96px;cursor:pointer;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:flvive 2s ease-in-out infinite}
#flav svg{width:100%;height:100%}#fl.habla #flav{animation:flhabla .25s ease-in-out infinite alternate}
@keyframes flvive{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-8px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}80%{transform:translateY(-4px)}}
@keyframes flhabla{from{transform:translateY(0) scale(1)}to{transform:translateY(-4px) scale(1.04)}}
.flwave{transform-origin:10px 70px;animation:flw 1.2s ease-in-out infinite alternate}@keyframes flw{from{transform:rotate(-20deg)}to{transform:rotate(25deg)}}
#flb{display:none;background:#fff;color:#1f2937;border-radius:20px 20px 6px 20px;padding:14px;width:min(340px,calc(100vw - 20px));box-shadow:0 14px 34px rgba(0,0,0,.25);font:600 18px/1.35 var(--sans)}
#flb.on{display:block;animation:baja .3s ease}
#flb .tx{margin-bottom:10px}#flb .ops{display:flex;flex-wrap:wrap;gap:8px}
#flb .op{border:0;border-radius:999px;padding:11px 14px;font:700 16px var(--sans);background:var(--ac);color:#fff;cursor:pointer}
#flb .op.alt{background:#f3f4f6;color:#1f2937}
#flb .esc{display:flex;gap:6px;margin-top:10px}#flb .esc input{flex:1;font:16px var(--sans);padding:10px;border-radius:12px;border:1.5px solid #e5e7eb;min-width:0}
#flb .esc button{border:0;border-radius:12px;background:#f3f4f6;font-size:20px;width:46px;cursor:pointer}
#flb .cerrar{float:right;border:0;background:none;font-size:20px;color:#9ca3af;cursor:pointer;margin:-6px -4px 0 6px}
#esc{position:fixed;inset:0;z-index:18;pointer-events:none;display:none;overflow:hidden}
#esc.on{display:block}#esc .big{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:150px;animation:escpop 1.2s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}
#esc .e{position:absolute;bottom:-60px;font-size:40px;animation:escsube linear forwards}
@keyframes escpop{0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg)}70%{transform:translate(-50%,-50%) scale(1.15) rotate(6deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes escsube{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(-115vh) rotate(40deg);opacity:.9}}
#flprop{position:absolute;left:-14px;top:30px;font-size:34px;display:none;animation:flprop 1.4s ease-in-out infinite;transform-origin:bottom center}
#flprop.on{display:block}@keyframes flprop{50%{transform:rotate(-14deg) translateY(-4px)}}
#flav{position:relative}
@keyframes baja{from{transform:translateY(-120%)}to{transform:none}}
.fmini{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:4px auto 8px;border:4px solid var(--card);box-shadow:0 0 0 2px var(--ac)}
.fini{display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),#f7d9a8);color:#fff;font:400 54px var(--script)}
.capa{position:fixed;inset:0;z-index:25;background:var(--bg);overflow:auto;display:none;padding:14px 14px 30px}
.capa.on{display:block}
.capa .top{display:flex;gap:12px;align-items:flex-start}
.capa .fgr{width:58%;max-width:300px;aspect-ratio:1;border-radius:22px;object-fit:cover;border:5px solid var(--card);box-shadow:0 0 0 3px var(--ac),0 12px 28px rgba(0,0,0,.18)}
.capa .fgr.fini{font-size:110px}
.capa h2{font:400 40px/1.05 var(--script);margin:6px 0 4px;color:var(--ink)}
#lienzo{width:100%;height:240px;background:#fff;border:2px dashed var(--ac);border-radius:18px;touch-action:none;display:block;margin-top:12px}
.colores{display:flex;gap:10px;align-items:center;margin:10px 0}.colores button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);cursor:pointer}.colores button.on{box-shadow:0 0 0 3px var(--ink)}
.firmas{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.firmas div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px;text-align:center;color:#1f2937;font-size:13px}.firmas img{width:100%;height:80px;object-fit:contain}.firmas div.yo{box-shadow:0 0 0 2px var(--ac)}
.cuadroF{text-align:center}.cuadroF .fgr{width:70%;max-width:340px;margin:8px auto 0;display:block}
</style>
</head>
<body>

};

function cuenta() {

    $('#cuenta').innerHTML = [[D, t('días')], [H, t('horas')], [M, t('min')], [S, t('seg')]].map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join('');
    $('#falta').textContent = d - Date.now() > 0 ? t('para {f}', {f: nomMin(F)}) : t('¡Hoy es la fiesta! 🎉'); };

async function buscar(v) {

  try { const r = await fetch('/api/fiesta?accion=buscar&f=' + CODE + '&q=' + encodeURIComponent(v)); const j = await r.json();
    res.innerHTML = (j.items || []).length ? j.items.map(x => `<button data-tok="${esc(x.tok)}">👤 ${esc(x.nombre)}</button>`).join('') : `<p style="color:var(--soft)">${t('No te encontramos todavía. Probá con tu apellido o pedile el link a la familia.')}</p>`;
    res.querySelectorAll('[data-tok]').forEach(b => b.onclick = () => { TOK = b.dataset.tok; try { localStorage.setItem(LS, TOK); } catch (e) {} history.replaceState(null, '', location.pathname + '?i=' + TOK); cargar(); });
  } catch (e) { res.innerHTML = `<p class="err">${t('No pudimos buscar. Revisá internet.')}</p>`; }
}
async function responder(va) {

  b.innerHTML = `<button class="cerrar" aria-label="${t('Cerrar')}">✕</button><div class="tx">${esc(texto)}</div><div class="ops">${(ops || []).map((o, i) => `<button class="op ${o.alt ? 'alt' : ''}" data-flo="${i}">${esc(o.t)}</button>`).join('')}</div>${conEscribir ? `<div class="esc"><input id="flin" placeholder="${t('Ej: dos cocas y un agua, o ¿dónde está el baño?')}"><button id="flmic" aria-label="${t('Hablar')}">🎤</button><button id="flok" aria-label="${t('Enviar')}">➤</button></div>` : ''}`;
  b.classList.add('on'); flHablar(texto);
  b.querySelector('.cerrar').onclick = () => b.classList.remove('on');
  b.querySelectorAll('[data-flo]').forEach(x => x.onclick = () => { flVoz = true; const o = ops[+x.dataset.flo]; o.f && o.f(); });
  const inp = $('#flin'); if (inp) { const ir = () => { const t = inp.value.trim(); if (t) flEntendi(t); }; $('#flok').onclick = ir; inp.onkeydown = e => { if (e.key === 'Enter') ir(); }; $('#flmic').onclick = flEscuchar; }
}
function flEscuchar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return flDecir(t('Tu celular no me deja escucharte. Escribime lo que querés 🙂'), [], true);
  try { const r = new SR(); r.lang = I18N.VOZ; r.interimResults = false; r.onresult = e => flEntendi(e.results[0][0].transcript); r.onerror = () => flDecir(t('No te escuché bien, hay mucha música 🎶. Escribímelo o tocá una opción.'), flOpsPedir(), true); $('#flmic').textContent = '👂'; r.start(); } catch (e) {}
}
function flOpsPedir() {
  const carta = (F.carta || []).filter(x => !(x.alc && INV.menor)).slice(0, 6);
  return carta.map(x => ({t: tc(x.n), f: () => flConfirmar([{n: x.n, c: 1}])})).concat([{t: t('Ver todo'), alt: true, f: () => { $('#flb').classList.remove('on'); const v = $('#vivo'); if (v) v.scrollIntoView({behavior: 'smooth'}); }}]);
}
const ICONO_LUGAR = n => /regal/i.test(n) ? '🎁' : /ba[ñn]o/i.test(n) ? '🚻' : /barra|trago/i.test(n) ? '🍹' : /foto/i.test(n) ? '📸' : /guardarropa|abrigo|campera/i.test(n) ? '🧥' : /salida|puerta/i.test(n) ? '🚪' : /terraza|rooftop/i.test(n) ? '🌇' : /cochera|estacion|parking/i.test(n) ? '🚗' : /fum|patio|jard/i.test(n) ? '🌙' : /pista|dj/i.test(n) ? '🪩' : '📍';
function lugarDe(t) { const L = F.lugares || [], tn = norm(t); if (!L.length) return null;
  const claves = [[/regal|gift|present|cadeau|geschenk|礼物|プレゼント/, /regal/], [/bano|toilet|toalet|bathroom|restroom|banheiro|bagno|wc|厕所|洗手间|トイレ/, /bano|toilet/], [/barra|trago|\bbar\b|吧台|バー/, /barra/], [/foto|photo|照|写真/, /foto/], [/abrigo|campera|saco|guardarropa|coat|cloak|chapelaria|guardaroba|vestiaire|garderobe|衣帽|クローク/, /guardarropa|abrigo/], [/salida|irme|puerta|exit|saida|uscita|sortie|ausgang|出口/, /salida|puerta/], [/fumar|fumo|cigarr|patio|smok|fumare|fumer|rauch|吸烟|タバコ/, /fum|patio/], [/pista|dj|dance|tanz|舞池|ダンス/, /pista|dj/], [/terraza|terrace|rooftop|terrazza|terrasse|露台|テラス/, /terraza/], [/patio|jardin|garden|jardim|giardino|garten|庭|花园/, /patio|jardin/], [/cochera|estacionamiento|auto|parking|car\b|estacionamento|parcheggio|parkplatz|停车|駐車/, /cochera|estacion/]];
  for (const [q, l] of claves) if (q.test(tn)) { const x = L.find(y => l.test(norm(y.n))); if (x) return x; }
  return L.find(y => norm(y.n).split(' ').some(w => w.length > 3 && tn.includes(w.replace(/s$/, '')))) || null; }
function flLugares() { const L = F.lugares || []; if (!L.length) return flDecir(t('La familia todavía no cargó los lugares del salón. Preguntale a una moza 🙂'), []);
  flDecir(t('¿Qué estás buscando?'), L.map(x => ({t: ICONO_LUGAR(x.n) + ' ' + tc(x.n), f: () => flDecir(`${ICONO_LUGAR(x.n)} ${tc(x.n)}: ${x.d}.`, [{t: t('📍 Otro lugar'), alt: true, f: flLugares}, {t: t('👍 Gracias'), alt: true, f: () => $('#flb').classList.remove('on')}])})), true); }
function flEntendi(q) { // q = lo que dijo el invitado
  if (ESTAC.test(q)) return flEstaciona();
  if (/\bpara\b/i.test(q) && !/d[oó]nde/i.test(q)) { const it = entender(q); if (it.avisoMenor && !it.length) return flDecir(t('Para los chicos te puedo pedir algo sin alcohol 🧃. ¿Qué les traemos?'), flOpsPedir(), true); if (it.length) { if (it.avisoMenor) flPend = null; return flConfirmar(it, it.avisoMenor); } }
  if (DONDE.test(q)) { const x = lugarDe(q); if (x) return flDecir(`${ICONO_LUGAR(x.n)} ${tc(x.n)}: ${x.d}.`, [{t: I18N.t('📍 Otro lugar'), alt: true, f: flLugares}, {t: t('👍 Gracias'), alt: true, f: () => $('#flb').classList.remove('on')}]); if (DONDE_Q.test(q)) return flLugares(); } const it = entender(q); if (!it.length) return flDecir(I18N.t('Mmm, no lo encontré en la carta 🤔. Tocá una opción o probá con otras palabras.'), flOpsPedir(), true); flConfirmar(it); }
const ESTAC = /cochera|estacion|parking|aparcar|estacionamento|parcheggio|parkplatz|parken|stationn|停车|駐車/i;
function flEstaciona() { const dir = [F.direccion, F.salon].filter(Boolean).join(', '), url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t('estacionamiento') + ' ' + dir), tel = String(F.estaciona || '').match(/\+?\d[\d\s-]{6,}\d/);
  flDecir(F.estaciona ? '🚗 ' + F.estaciona : t('La familia no cargó datos del estacionamiento. Te muestro los que hay cerca en el mapa 🗺'), [{t: t('🗺 Ver en el mapa'), f: () => open(url, '_blank')}].concat(tel ? [{t: t('📞 Llamar'), alt: true, f: () => { location.href = 'tel:' + tel[0].replace(/[^\d+]/g, ''); }}] : []).concat([{t: t('👍 Gracias'), alt: true, f: () => $('#flb').classList.remove('on')}])); }
const DONDE_Q = /d[oó]nde|where|onde|dove|\bo[uù]\b|\bwo\b|哪|どこ/i, DONDE = new RegExp(DONDE_Q.source + '|ba[ñn]o|regalo|guardarropa|salida|fumar|abrigo|bathroom|restroom|toilet|banheiro|bagno|\\bwc\\b|厕所|洗手间|トイレ|gift|present|cadeau|geschenk|礼物|プレゼント|exit|coat|terraza|terrace|patio|garden|cochera|estacionamiento|parking|停车|駐車|テラス', 'i');
const listaPed = p => { const it = p.items || []; return it.length === 1 ? t('tu {x}', {x: (it[0].c > 1 ? it[0].c + ' ' : '') + tc(it[0].n)}) : t('tu pedido ({x})', {x: it.map(x => (x.c > 1 ? x.c + ' ' : '') + tc(x.n)).join(', ')}); };
const listaTx = it => { const quienes = new Set(it.map(x => x.p || '')); return it.map(x => x.c + ' ' + tc(x.n) + (quienes.size > 1 || x.p && x.p !== 'vos' ? ' ' + t('para {p}', {p: x.p || 'vos'}) : '')).join(', ').replace(/, ([^,]*)$/, ' ' + t('y') + ' $1'); };
function flConfirmar(it, menor) { flPend = it; flDecir(`${menor ? t('Lo que tiene alcohol no se lo puedo pedir a los chicos 🧃. ') : ''}${t('¿Te pido {x}?', {x: listaTx(it)})}`, [{t: t('✅ Sí, pedir'), f: flPedir}, {t: t('✏️ Cambiar'), alt: true, f: () => flDecir(t('Decime qué querés 🙂'), flOpsPedir(), true)}]); }
async function flPedir() {
  if (!flPend) return; const it = flPend; flPend = null;
  try { const r = await fetch('/api/fiesta?accion=pedir', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({f: CODE, i: TOK, items: it, mesa: MESA})}); const j = await r.json();
    if (!r.ok) throw new Error(j.error || t('No se pudo')); marcaInter(); await vivoTick(); flDecir(j.moza ? t('¡Listo! 🛎 Ya se lo paso a {m}, que atiende tu mesa. Te aviso cuando va en camino.', {m: j.moza}) : t('¡Listo! 🛎 Ya se lo paso a la encargada. Enseguida te aviso quién te trae {q}.', {q: it.length === 1 ? t('tu {x}', {x: tc(it[0].n)}) : t('tu pedido')}), [{t: t('👍 Gracias'), alt: true, f: () => $('#flb').classList.remove('on')}]);
  } catch (e) { flDecir('😕 ' + e.message, [{t: t('Ok'), alt: true, f: () => $('#flb').classList.remove('on')}]); }
}
function flQueViene() { const M = momentos(), sig = M.filter(x => x.ts > Date.now()).slice(0, 3); flDecir(sig.length ? t('Lo que viene: ') + sig.map(x => `${hhmm(x.ts)} ${tc(x.nombre)}`).join(' · ') + ' ✨' : t('Ya pasaron todos los momentos del cronograma. ¡A disfrutar! 💃'), [{t: t('🥤 Pedir algo'), f: () => flDecir(t('¿Qué te traemos?'), flOpsPedir(), true)}, {t: t('Listo'), alt: true, f: () => $('#flb').classList.remove('on')}]); }
const LSI = () => 'fiestaInter:' + CODE;
const marcaInter = () => { try { localStorage.setItem(LSI(), String(Date.now())); } catch (e) {} };
function flMenu() { const nom = INV.nombre.split(' ')[0], mesa = INV.mesa || MESA;
  const reg = (F.lugares || []).find(x => /regal/i.test(x.n));
  flDecir(`${t('¡Hola {n}! ', {n: nom})}${mesa ? t('Estás en la mesa {m}. ', {m: mesa}) : ''}${reg && reg.d && !yaSaludo() ? t('Si traés regalo, la mesa de regalos está {d} 🎁. ', {d: reg.d}) : ''}${t('¿Querés que te traigan algo para tomar?')}`, [{t: t('🥤 Sí, pedir algo'), f: () => flDecir(t('¿Qué te traemos?'), flOpsPedir(), true)}, {t: t('⏰ ¿Qué viene?'), alt: true, f: flQueViene}, {t: t('📋 Todo el programa'), alt: true, f: () => { $('#flb').classList.remove('on'); progAbierto = true; pVivo(); const d = document.querySelector('.prog'); if (d) d.scrollIntoView({behavior: 'smooth', block: 'center'}); }}].concat((F.lugares || []).length ? [{t: t('📍 ¿Dónde está…?'), alt: true, f: flLugares}] : []).concat(F.estaciona ? [{t: t('🚗 Estacionamiento'), alt: true, f: flEstaciona}] : []).concat([{t: t('✍️ Firmar la foto'), alt: true, f: () => { $('#flb').classList.remove('on'); abrirFirma(); }}]).concat([{t: t('Ahora no'), alt: true, f: () => { marcaInter(); $('#flb').classList.remove('on'); }}]), true); try { localStorage.setItem('fiestaSaludo:' + CODE, '1'); } catch (e) {} }
const yaSaludo = () => { try { return !!localStorage.getItem('fiestaSaludo:' + CODE); } catch (e) { return false; } };
function flPasoDeVez() { // cada tanto, sin molestar: "¿te falta algo en la mesa?"
  if (!FL || $('#flb').classList.contains('on') || document.hidden) return;
  let ult = 0; try { ult = +localStorage.getItem(LSI()) || 0; } catch (e) {}
  if (Date.now() - ult < 30 * 60e3) return; marcaInter();
  const extras = (F.carta || []).filter(x => /pan|hielo|servillet|agua/i.test(x.n)).slice(0, 4);
  const frases = [t('¿Te falta algo en la mesa? 🙂'), t('¿Te traigo algo más para tomar? 🥤'), t('¿Necesitás más pan, hielo o servilletas?')];
  flDecir(frases[Math.floor(Math.random() * frases.length)], extras.map(x => ({t: tc(x.n), f: () => flConfirmar([{n: x.n, c: 1}])})).concat([{t: t('🥤 Otra cosa'), f: () => flDecir(t('¿Qué te traemos?'), flOpsPedir(), true)}, {t: t('No, gracias'), alt: true, f: () => $('#flb').classList.remove('on')}]));
}
// El celular solo deja hablar después de un toque: con el primer toque en cualquier parte, Flashy queda habilitado para hablar.
function flDesbloquear() { if (flVoz) return; flVoz = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
['pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, flDesbloquear, {passive: true}));
function flashy() {
  if (FL || !F || !F.vivo || !F.hoy || !INV || PREV) return; FL = true; $('#flav').innerHTML = flSVG(F.flLook || 'traje'); $('#fl').classList.add('on');
  $('#flav').onclick = () => { flVoz = true; $('#flb').classList.contains('on') ? $('#flb').classList.remove('on') : flMenu(); };
  let ult = 0; try { ult = +localStorage.getItem(LSI()) || 0; } catch (e) {}
  if (!ult) { setTimeout(flMenu, 1200); marcaInter(); }
  setInterval(flPasoDeVez, 60e3);
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}
function arrancarVivo() { flashy(); clearInterval(vivoTimer); if (F && F.vivo && F.hoy && INV && !PREV) { vivoTick(); vivoTimer = setInterval(vivoTick, 7000); } }
const esIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function guardar() {
  const el = $('#guardar'); if (!el) return;
  if (instalada()) { el.innerHTML = `<h3>${t('Tu fiesta')}</h3><p>${t('✅ Ya tenés la fiesta guardada en tu celular.')}</p><p>${t('🔔 El día de la fiesta abrila desde el ícono, <b>activá los avisos</b> y dejá el celular con sonido o vibración: te vamos a avisar de la comida, el vals y la torta.')}</p>`; return; }
  el.innerHTML = `<h3>${t('Guardala en tu celular')}</h3><p>${t('<b>Guardala en tu celular y dejá todo activado para que el día de la fiesta no te pierdas nada.</b> Desde acá te vamos a avisar cuándo sale la comida, cuándo es el vals y la torta, aunque estés afuera.')}</p><button class="btn big2" id="inst">${t('📲 Guardar la fiesta en mi celular')}</button><p style="font-size:15px;margin-top:12px">${t('🔔 El día de la fiesta: abrila, <b>activá los avisos</b> y dejá el celular con sonido o vibración.')}</p>`;
  $('#inst').onclick = instalar;
}
async function instalar() {
  if (PREV) return;
  if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; return; }
  const ios = esIOS();
  $('#modalIn').innerHTML = `<h3 style="margin:0 0 6px">${t('📲 Guardar la fiesta')}</h3><ol>${(ios ? ['Tocá el botón <b>Compartir</b> <span style="font-size:20px">⬆️</span> (abajo en Safari).', 'Elegí <b>“Agregar a inicio”</b>.', 'Tocá <b>Agregar</b>. ¡Listo! Te queda el ícono de la fiesta.'] : ['Tocá el menú <b>⋮</b> arriba a la derecha.', 'Elegí <b>“Agregar a la pantalla principal”</b> o <b>“Instalar”</b>.', 'Confirmá. ¡Listo! Te queda el ícono de la fiesta.']).map(x => `<li>${t(x)}</li>`).join('')}</ol><button class="btn big2" id="cerrar">${t('Entendido')}</button>`;
  $('#modal').classList.add('on'); $('#cerrar').onclick = () => $('#modal').classList.remove('on');
}
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; });
document.addEventListener('click', e => { const b = e.target.closest('[data-copiar]'); if (!b) return; navigator.clipboard && navigator.clipboard.writeText(b.dataset.copiar).then(() => { b.textContent = t('✅ Copiado'); setTimeout(() => b.textContent = t('📋 Copiar'), 1800); }); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') e.currentTarget.classList.remove('on'); });

async function cargar() {
  try {
    const r = await fetch('/api/fiesta?accion=ver&f=' + encodeURIComponent(CODE) + (TOK ? '&i=' + encodeURIComponent(TOK) : ''));
    const j = await r.json(); if (!r.ok) throw new Error(j.error || t('No encontramos esta fiesta.'));
    F = j.fiesta; INV = j.inv || null; render(); arrancarVivo();
    if (P.get('firmas') === '1') verCuadro(false, P.get('k') ? '&k=' + encodeURIComponent(P.get('k')) : P.get('p') ? '&p=' + encodeURIComponent(P.get('p')) : null);
  } catch (e) { $('#app').innerHTML = `<div class="carga">😕 ${esc(e.message)}</div>`; }
}
if (PREV) {
  addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.tipo !== 'fiesta-prev') return; F = e.data.fiesta; render(); });
  parent.postMessage({tipo: 'fiesta-prev-listo'}, location.origin);
} else if (!CODE) { $('#app').innerHTML = `<div class="carga">${t('Falta el link de la fiesta.')}</div>`; }
else {
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = '/api/fiesta?manifest=' + encodeURIComponent(CODE); document.head.appendChild(l);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  cargar();
}
if (!PREV) I18N.boton();
</script>
