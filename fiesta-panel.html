<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopFiesta · Panel de tu fiesta</title>
<meta name="description" content="Armá la invitación de tu fiesta, mandala por WhatsApp y mirá quién confirmó.">
<meta property="og:title" content="ShopFiesta · Tu fiesta organizada desde el celular">
<meta property="og:description" content="Invitación virtual, confirmaciones y la app de tu fiesta. Pro Video JSRHG.">
<meta property="og:image" content="https://vitrina360app.com.ar/og-fiesta.png">
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/fiesta-192.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#b08a2e;--bg:#f7f5f0;--card:#fff;--ink:#1f2937;--soft:#4b5563;--line:#e5e1d8;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fffdf8;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:18px}header small{color:var(--soft)}
.tabs{display:flex;gap:6px;padding:10px 16px 0;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.tabs button{border:0;background:#ece8de;color:var(--ink);font:700 15px inherit;font-family:inherit;padding:10px 14px;border-radius:12px 12px 0 0;cursor:pointer}
.tabs button.on{background:var(--card);box-shadow:0 -2px 0 var(--ac) inset}
main{max-width:1100px;margin:0 auto;padding:0 16px 120px}
.grid{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}.prevcol{display:none}.prevcol.on{display:block}}
.box{background:var(--card);border:1px solid var(--line);border-radius:0 16px 16px 16px;padding:18px}
.sec{margin:0 0 22px}.sec h3{margin:0 0 10px;font-size:17px}
label{display:block;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:16px 'Figtree',system-ui;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;color:var(--ink)}
.opt.on{border-color:var(--ac);background:#fffaf0}.opt b{display:block;font-size:16px}.opt small{color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 15px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--ac);background:#fffaf0}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;margin:10px 0}.chk input{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 16px;font:700 15px inherit;font-family:inherit;cursor:pointer;background:var(--ac);color:#fff;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wa{background:#25d366;color:#08311a}
.btn.sm{padding:7px 10px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.55}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;justify-content:center;align-items:center;z-index:6}
.barra .estado{color:var(--soft);font-size:14px}
.prevcol{position:sticky;top:64px}
.tel{border-radius:34px;border:10px solid #1f2937;overflow:hidden;height:min(680px,calc(100vh - 160px));background:#fff;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.tel iframe{width:100%;height:100%;border:0}
.fotoprev{display:flex;align-items:center;gap:12px;margin-top:8px}.fotoprev img{width:76px;height:76px;border-radius:50%;object-fit:cover}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em}
td input{padding:7px 8px;font-size:15px}td input.n{width:64px}td select{padding:7px;width:auto}
.tabla{overflow-x:auto}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:560px){.cifras{grid-template-columns:repeat(2,1fr)}}
.cifra{background:#faf8f3;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.cifra b{display:block;font-size:28px}.cifra small{color:var(--soft)}
.hero{max-width:640px;margin:40px auto;text-align:center;padding:0 16px}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 10px}.hero p{color:var(--soft);font-size:18px}
.lista li{margin:6px 0}
.aviso{background:#fff7e0;border:1px solid #f0dfa8;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.modal.on{display:flex}.modal .in{background:#fff;border-radius:18px;max-width:480px;width:100%;padding:20px}
.ok{color:var(--ok);font-weight:700}.muted{color:var(--soft);font-size:14px}
code{background:#f3f1ea;padding:2px 6px;border-radius:6px;word-break:break-all}
.pie{text-align:center;color:var(--soft);font-size:13px;margin:30px 0}
</style>
</head>
<body>
<header><b>🎉 ShopFiesta</b><small id="hdr">Panel de tu fiesta</small></header>
<div id="raiz"></div>
<div class="modal" id="modal"><div class="in" id="modalIn"></div></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = new URLSearchParams(location.search);
let CODE = (P.get('f') || '').toUpperCase(), K = P.get('k') || '', D = null, RESP = [], tab = 'inv', sucio = false, DEMO = false, tituloTocado = false;
const TITULOS = {'15': 'Mis 15', casamiento: 'Nos casamos', cumple: 'Mi cumple', bautismo: 'Mi bautismo', egresados: 'Fiesta de egresados', otro: 'Te invito'};
const PLANT = [['elegante', 'Elegante', '#fbf7f0'], ['flores', 'Flores', '#fbf1f3'], ['brillos', 'Brillos', '#1d1b2f'], ['moderna', 'Moderna', '#f5f5f2'], ['mariposas', 'Mariposas', '#f3effa'], ['luna', 'Luna y estrellas', '#1c2440']];
const COLORES = ['#c9a227', '#d98ca0', '#9b87c9', '#6fa8c9', '#7fa88a', '#9aa3ad', '#a85a6a', '#d4a373'];
const nuevo = () => ({tipo: '15', modo: 'especial', plantilla: 'elegante', color: '#c9a227', titulo: 'Mis 15', nombre: '', frase: 'Hay momentos que no se olvidan. Quiero compartir este con vos.', fecha: '', hora: '21:30', salon: '', direccion: '', vestimenta: '', regalo: '', mostrarMesa: false, pedirMenu: true, organiza: '', catering: '', cateringTel: '', mozas: [], foto: '', invitados: []});
const mis = () => { try { return JSON.parse(localStorage.getItem('misFiestas') || '[]'); } catch (e) { return []; } };
const guardarMis = () => { if (!CODE || !K || DEMO) return; const l = mis().filter(x => x.code !== CODE); l.unshift({code: CODE, k: K, nombre: D.nombre || ''}); try { localStorage.setItem('misFiestas', JSON.stringify(l.slice(0, 10))); } catch (e) {} };
const enviados = () => { try { return JSON.parse(localStorage.getItem('fiestaEnv:' + CODE) || '{}'); } catch (e) { return {}; } };
const marcarEnv = id => { const e = enviados(); e[id] = Date.now(); try { localStorage.setItem('fiestaEnv:' + CODE, JSON.stringify(e)); } catch (x) {} };
const linkGeneral = () => location.origin + '/fiesta/' + CODE;
const linkDe = g => linkGeneral() + '?i=' + g.tok;
const fechaLarga = () => { if (!D.fecha) return ''; const s = new Date(D.fecha + 'T12:00:00-03:00').toLocaleDateString('es-AR', {weekday: 'long', day: 'numeric', month: 'long', timeZone: 'America/Argentina/Buenos_Aires'}); return s.charAt(0).toUpperCase() + s.slice(1); };
const invita = () => D.tipo === '15' ? `${D.nombre} te invita a sus 15 💖` : D.tipo === 'casamiento' ? `${D.nombre} te invitan a su casamiento 💍` : `${D.nombre} te invita a su fiesta 🥳`;
const msgDe = g => `🎉 ¡Hola ${g.nombre.split(' ')[0]}! ${invita()}\n📅 ${fechaLarga()}${D.hora ? ' a las ' + D.hora + ' h' : ''}${D.salon ? '\n📍 ' + D.salon : ''}\n\nAbrí tu invitación y confirmá acá 👉 ${linkDe(g)}`;
const msgGrupo = () => `🎉 ¡${D.fecha ? 'Se viene' : 'Llega'} ${D.tipo === '15' ? 'el cumple de 15 de ' + D.nombre : 'la fiesta de ' + D.nombre}!\n📅 ${fechaLarga()}${D.hora ? ' a las ' + D.hora + ' h' : ''}\n\nSi todavía no confirmaste o no guardaste la fiesta en tu celular, tocá acá 👉 ${linkGeneral()} y buscá tu nombre. ¡Te esperamos!`;
const waNum = t => { let n = String(t || '').replace(/\D/g, ''); if (!n) return ''; if (n.startsWith('0')) n = n.slice(1); if (n.length === 10) n = '549' + n; return n; };
const waLink = (tel, txt) => 'https://wa.me/' + waNum(tel) + '?text=' + encodeURIComponent(txt);

function inicio() {
  const l = mis();
  if (!CODE) {
    $('#raiz').innerHTML = `<div class="hero"><h1>La invitación y la app de tu fiesta 💌</h1><p>Elegí un diseño, cargá tus invitados y mandales su invitación por WhatsApp. Cada uno confirma, y vos ves quién viene y quién no.</p>
      <button class="btn" id="empezar" style="font-size:18px;padding:14px 22px">✨ Armar mi invitación</button>
      <p style="margin-top:18px"><a href="/fiesta/DEMO15" target="_blank">👀 Ver una invitación de muestra</a></p>
      ${l.length ? `<div class="box" style="text-align:left;margin-top:24px;border-radius:16px"><h3 style="margin-top:0">Mis fiestas</h3><ul class="lista">${l.map(x => `<li><a href="/fiesta-panel?f=${esc(x.code)}&k=${esc(x.k)}">${esc(x.nombre || x.code)}</a></li>`).join('')}</ul></div>` : ''}</div>
      <div class="pie">ShopFiesta · Pro Video JSRHG</div>`;
    $('#empezar').onclick = () => { D = nuevo(); pintar(); };
    return;
  }
  cargar();
}
async function cargar() {
  $('#raiz').innerHTML = '<p style="text-align:center;padding:60px">Cargando tu fiesta…</p>';
  try {
    const r = await fetch('/api/fiesta?accion=panel&f=' + encodeURIComponent(CODE) + '&k=' + encodeURIComponent(K)); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'No se pudo abrir');
    D = Object.assign(nuevo(), j.fiesta); RESP = j.resp || []; DEMO = !!j.demo; tituloTocado = true; guardarMis(); pintar();
  } catch (e) { $('#raiz').innerHTML = `<div class="hero"><h1>😕 ${esc(e.message)}</h1><p><a href="/fiesta-panel">Volver</a></p></div>`; }
}
function pintar() {
  $('#hdr').textContent = D.nombre ? (D.tipo === '15' ? 'Los 15 de ' : 'Fiesta de ') + D.nombre : 'Nueva fiesta';
  const pend = (D.invitados || []).length;
  $('#raiz').innerHTML = `<div class="tabs"><button data-tab="inv">1. La invitación</button><button data-tab="gente">2. Invitados (${pend})</button><button data-tab="conf">3. Confirmaciones</button></div><main id="main"></main>
    <div class="barra">${DEMO ? '<span class="estado">👀 Esto es una muestra. <a href="/fiesta-panel">Armá la tuya</a></span>' : `<span class="estado" id="estado">${CODE ? '' : 'Todavía no guardaste'}</span><button class="btn alt" id="verPrev">👀 Ver cómo queda</button><button class="btn" id="guardar">💾 Guardar</button>`}</div>`;
  $$('.tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab === tab); b.onclick = () => { tab = b.dataset.tab; pintar(); }; });
  if (!DEMO) { $('#guardar').onclick = guardar; $('#verPrev').onclick = () => { if (tab !== 'inv') { tab = 'inv'; pintar(); } const c = $('.prevcol'); c.classList.toggle('on'); c.scrollIntoView({behavior: 'smooth'}); }; }
  if (tab === 'inv') pInv(); else if (tab === 'gente') pGente(); else pConf();
}
const cambio = () => { sucio = true; const e = $('#estado'); if (e) e.textContent = 'Hay cambios sin guardar'; prev(); };
function prev() { const fr = $('#prev'); if (fr && fr.contentWindow) fr.contentWindow.postMessage({tipo: 'fiesta-prev', fiesta: Object.assign({}, D, {code: CODE || 'PREV'})}, location.origin); }
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.tipo === 'fiesta-prev-listo') prev(); });

function pInv() {
  const campo = (id, lbl, ph, tipo) => `<label for="c_${id}">${lbl}</label><input id="c_${id}" data-k="${id}" type="${tipo || 'text'}" value="${esc(D[id])}" placeholder="${esc(ph || '')}">`;
  $('#main').innerHTML = `<div class="grid"><div class="box">
    <div class="sec"><h3>¿Qué tipo de invitación querés?</h3><div class="opts">
      ${[['especial', '💌 Especial', 'Con foto y diseño completo'], ['comun', '✉️ Común', 'Diseño lindo, sin foto'], ['link', '🔗 Solo el link', 'Para confirmar y guardar la fiesta en el celular']].map(([v, t, s]) => `<button class="opt ${D.modo === v ? 'on' : ''}" data-modo="${v}"><b>${t}</b><small>${s}</small></button>`).join('')}</div></div>
    <div class="sec"><h3>La fiesta</h3><div class="row"><div><label>Tipo de fiesta</label><select data-k="tipo">${[['15', '15 años'], ['casamiento', 'Casamiento'], ['cumple', 'Cumpleaños'], ['bautismo', 'Bautismo'], ['egresados', 'Egresados'], ['otro', 'Otra']].map(([v, t]) => `<option value="${v}" ${D.tipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div><div>${campo('titulo', 'Título', 'Mis 15')}</div></div>
      ${campo('nombre', 'Nombre (como aparece grande)', 'Julieta')}
      ${D.modo !== 'link' ? `<label>Frase</label><textarea data-k="frase" maxlength="220">${esc(D.frase)}</textarea>` : ''}
      <div class="row"><div>${campo('fecha', 'Fecha', '', 'date')}</div><div>${campo('hora', 'Hora', '', 'time')}</div></div>
      <div class="row"><div>${campo('salon', 'Salón', 'Nombre del salón')}</div><div>${campo('direccion', 'Dirección', 'Calle, número, ciudad')}</div></div>
      ${D.modo !== 'link' ? `<div class="row"><div>${campo('vestimenta', 'Vestimenta (opcional)', 'Elegante sport')}</div><div>${campo('regalo', 'Regalo (opcional)', 'Lluvia de sobres o alias')}</div></div>` : ''}
    </div>
    ${D.modo !== 'link' ? `<div class="sec"><h3>Diseño</h3><div class="chips">${PLANT.map(([v, t, bg]) => `<button class="chip ${D.plantilla === v ? 'on' : ''}" data-plant="${v}"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${bg};border:1px solid #ccc;vertical-align:-2px;margin-right:6px"></span>${t}</button>`).join('')}</div>
      <label>Color principal</label><div class="chips" style="align-items:center">${COLORES.map(c => `<button class="sw ${D.color === c ? 'on' : ''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}<input type="color" data-k="color" value="${esc(D.color)}" style="width:52px;height:40px;padding:2px"></div>
      ${D.modo === 'especial' ? `<label>Foto</label><input type="file" accept="image/*" id="foto"><div class="fotoprev">${D.foto ? `<img src="${esc(D.foto)}" alt=""><button class="btn alt sm" id="sinFoto">Quitar foto</button>` : '<span class="muted">Elegí una foto linda, de frente. Se recorta en círculo.</span>'}</div>` : ''}</div>` : ''}
    <div class="sec"><h3>Opciones</h3>
      <label class="chk"><input type="checkbox" data-k="pedirMenu" ${D.pedirMenu ? 'checked' : ''}> Preguntar si necesitan menú especial (vegetariano, sin TACC, infantil…)</label>
      <label class="chk"><input type="checkbox" data-k="mostrarMesa" ${D.mostrarMesa ? 'checked' : ''}> Mostrar a cada invitado su número de mesa</label></div>
    <div class="sec"><h3>El día de la fiesta: catering y mozas</h3><p class="muted">Se usa en la fiesta: cuando un invitado pide algo, le avisa "Ya va Karina a tu mesa".</p>
      <div class="row"><div>${campo('catering', 'Catering o empresa de mozos', 'Nombre')}</div><div>${campo('cateringTel', 'Teléfono del encargado', '223…', 'tel')}</div></div>
      <label>Mozas y mozos (uno por línea)</label><textarea id="mozas" placeholder="Karina&#10;Sofía&#10;Lucía">${esc((D.mozas || []).join('\n'))}</textarea></div>
  </div><div class="prevcol"><div class="tel"><iframe id="prev" src="/fiesta.html?prev=1" title="Vista previa"></iframe></div><p class="muted" style="text-align:center">Así la ven tus invitados</p></div></div>`;
  $$('[data-k]').forEach(el => el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'color' ? 'change' : 'input', () => {
    const k = el.dataset.k; D[k] = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'titulo') tituloTocado = true;
    if (k === 'tipo' && !tituloTocado) { D.titulo = TITULOS[D.tipo] || ''; const t = $('#c_titulo'); if (t) t.value = D.titulo; }
    if (k === 'color') $$('.sw').forEach(s => s.classList.toggle('on', s.dataset.color === D.color));
    if (k === 'nombre') $('#hdr').textContent = (D.tipo === '15' ? 'Los 15 de ' : 'Fiesta de ') + D.nombre;
    cambio(); }));
  $$('[data-modo]').forEach(b => b.onclick = () => { D.modo = b.dataset.modo; cambio(); pInv(); });
  $$('[data-plant]').forEach(b => b.onclick = () => { D.plantilla = b.dataset.plant; $$('[data-plant]').forEach(x => x.classList.toggle('on', x === b)); cambio(); });
  $$('[data-color]').forEach(b => b.onclick = () => { D.color = b.dataset.color; $$('.sw').forEach(s => s.classList.toggle('on', s === b)); const c = $('input[type=color]'); if (c) c.value = D.color; cambio(); });
  $('#mozas').addEventListener('input', e => { D.mozas = e.target.value.split('\n').map(s => s.trim()).filter(Boolean); cambio(); });
  const fi = $('#foto'); if (fi) fi.onchange = async () => { const f = fi.files[0]; if (!f) return; try { D.foto = await achicar(f); cambio(); pInv(); } catch (e) { alert('No pudimos leer esa foto. Probá con otra.'); } };
  const sf = $('#sinFoto'); if (sf) sf.onclick = () => { D.foto = ''; cambio(); pInv(); };
  if (DEMO) $$('#main input,#main select,#main textarea,#main button').forEach(x => x.disabled = true);
  setTimeout(prev, 300);
}
function achicar(file) {
  return new Promise((ok, ko) => { const img = new Image(); img.onload = () => { const max = 1000, s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); let q = .85, u = c.toDataURL('image/jpeg', q); while (u.length > 600000 && q > .4) { q -= .1; u = c.toDataURL('image/jpeg', q); } URL.revokeObjectURL(img.src); ok(u); }; img.onerror = ko; img.src = URL.createObjectURL(file); });
}

function parsear(txt) {
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const g = {nombre: '', mesa: '', cupo: 0, menor: false, tel: ''}; let resto = [];
    l.split(/[,;\t]|\s-\s/).map(s => s.trim()).filter(Boolean).forEach(p => {
      let m;
      if ((m = p.match(/^mesa\s*(\w{1,4})$/i))) g.mesa = m[1];
      else if (/^\+?[\d\s()-]{8,}$/.test(p)) g.tel = p.replace(/[^\d+]/g, '');
      else if (/^\d{1,3}$/.test(p)) g.mesa = p;
      else if (/^menor$/i.test(p)) g.menor = true;
      else if ((m = p.match(/^\+\s*(\d)$/))) g.cupo = +m[1];
      else resto.push(p);
    });
    g.nombre = resto.join(' ').replace(/\s+/g, ' ').slice(0, 60); return g;
  }).filter(g => g.nombre);
}
function pGente() {
  const env = enviados(), L = D.invitados || [];
  $('#main').innerHTML = `<div class="box">
    <div class="sec"><h3>Agregar invitados</h3><p class="muted">Pegá la lista: un invitado por línea. Si querés, sumá la mesa y el teléfono separados por coma. Ej: <code>Roberto Hernández, mesa 2, 2235551234</code>. Para acompañantes: <code>+1</code>. Para menores: <code>menor</code>.</p>
      <textarea id="pegar" placeholder="Roberto Hernández, mesa 2, 2235551234&#10;Marta Gómez, mesa 2&#10;Sofía Pérez, mesa 7, menor"></textarea>
      <button class="btn" id="agregar" style="margin-top:8px">➕ Agregar a la lista</button></div>
    ${L.length ? `<div class="sec"><h3>Lista (${L.length})</h3>${L.some(g => !g.tok) ? '<div class="aviso">💾 Tocá <b>Guardar</b> para que cada invitado nuevo tenga su link personal.</div>' : ''}
      <div class="tabla"><table><thead><tr><th>Nombre</th><th>Mesa</th><th>Acomp.</th><th>Menor</th><th>Teléfono</th><th>Invitación</th><th></th></tr></thead><tbody>
      ${L.map((g, i) => `<tr><td><input data-i="${i}" data-c="nombre" value="${esc(g.nombre)}"></td><td><input class="n" data-i="${i}" data-c="mesa" value="${esc(g.mesa)}"></td>
        <td><select data-i="${i}" data-c="cupo">${[0, 1, 2, 3, 4, 5].map(n => `<option ${+g.cupo === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>
        <td><input type="checkbox" data-i="${i}" data-c="menor" ${g.menor ? 'checked' : ''} style="width:20px;height:20px"></td>
        <td><input data-i="${i}" data-c="tel" value="${esc(g.tel)}" style="width:130px" inputmode="tel"></td>
        <td>${g.tok ? `<a class="btn wa sm" data-env="${esc(g.id)}" href="${waLink(g.tel, msgDe(g))}" target="_blank" rel="noopener">${env[g.id] ? '✓ Reenviar' : '📲 WhatsApp'}</a> <button class="btn alt sm" data-copy="${esc(linkDe(g))}">🔗</button>` : '<span class="muted">Guardá primero</span>'}</td>
        <td><button class="btn alt sm" data-del="${i}" aria-label="Borrar">🗑</button></td></tr>`).join('')}</tbody></table></div></div>` : ''}
    ${CODE ? `<div class="sec"><h3>Recordatorio para todos (el día de la fiesta)</h3><p class="muted">Mandalo al grupo de WhatsApp de la fiesta o como lista de difusión. El que no tiene su link, busca su nombre.</p>
      <textarea readonly style="min-height:120px">${esc(msgGrupo())}</textarea>
      <button class="btn alt" data-copy="${esc(msgGrupo())}">📋 Copiar mensaje</button> <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(msgGrupo())}" target="_blank" rel="noopener">📲 Mandar por WhatsApp</a></div>` : ''}
  </div>`;
  $('#agregar').onclick = () => { const n = parsear($('#pegar').value); if (!n.length) return; D.invitados = (D.invitados || []).concat(n); cambio(); pintar(); };
  $$('[data-c]').forEach(el => el.addEventListener('change', () => { const g = D.invitados[+el.dataset.i], c = el.dataset.c; g[c] = el.type === 'checkbox' ? el.checked : c === 'cupo' ? +el.value : el.value; cambio(); }));
  $$('[data-del]').forEach(b => b.onclick = () => { const g = D.invitados[+b.dataset.del]; if (!confirm('¿Borrar a ' + g.nombre + ' de la lista?')) return; D.invitados.splice(+b.dataset.del, 1); cambio(); pintar(); });
  $$('[data-env]').forEach(a => a.addEventListener('click', () => { marcarEnv(a.dataset.env); setTimeout(() => { a.textContent = '✓ Reenviar'; }, 300); }));
  if (DEMO) $$('#main input,#main select,#main textarea,#agregar,[data-del]').forEach(x => x.disabled = true);
}
async function pConf() {
  if (!CODE) { $('#main').innerHTML = '<div class="box"><p>Guardá la fiesta y mandá las invitaciones para ver las confirmaciones acá.</p></div>'; return; }
  if (!DEMO && !sucio) { try { const r = await fetch('/api/fiesta?accion=panel&f=' + CODE + '&k=' + encodeURIComponent(K)); const j = await r.json(); if (r.ok) RESP = j.resp || []; } catch (e) {} }
  const R = {}; RESP.forEach(x => { R[x.gid] = x; });
  const L = D.invitados || [], van = L.filter(g => R[g.id] && R[g.id].va), nov = L.filter(g => R[g.id] && !R[g.id].va), pen = L.filter(g => !R[g.id]);
  const personas = van.reduce((s, g) => s + (R[g.id].cuantos || 1), 0), menus = {};
  van.forEach(g => { const m = R[g.id].menu; if (m) menus[m] = (menus[m] || 0) + (R[g.id].cuantos || 1); });
  const fila = (g, est) => { const r = R[g.id] || {}; return `<tr><td>${esc(g.nombre)}</td><td>${esc(g.mesa || '')}</td><td>${est}</td><td>${r.va ? r.cuantos || 1 : ''}</td><td>${esc(r.menu || '')}</td><td>${esc(r.nota || '')}</td><td>${!R[g.id] && g.tok ? `<a class="btn wa sm" href="${waLink(g.tel, '👋 ¡Hola ' + g.nombre.split(' ')[0] + '! ¿Venís a la fiesta de ' + D.nombre + '? Confirmá acá 👉 ' + linkDe(g))}" target="_blank" rel="noopener">Recordar</a>` : ''}</td></tr>`; };
  $('#main').innerHTML = `<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">Confirmaciones</h3><button class="btn alt sm" id="act">🔄 Actualizar</button></div><br>
    <div class="cifras"><div class="cifra"><b class="ok">${van.length}</b><small>confirmaron</small></div><div class="cifra"><b>${personas}</b><small>personas en total</small></div><div class="cifra"><b>${nov.length}</b><small>no van</small></div><div class="cifra"><b>${pen.length}</b><small>sin responder</small></div></div>
    ${Object.keys(menus).length ? `<p><b>Menús especiales para el catering:</b> ${Object.entries(menus).map(([m, n]) => n + ' ' + esc(m)).join(' · ')}</p>` : ''}
    <div class="tabla"><table><thead><tr><th>Invitado</th><th>Mesa</th><th>Estado</th><th>Personas</th><th>Menú</th><th>Mensaje</th><th></th></tr></thead><tbody>
    ${van.map(g => fila(g, '✅ Va')).join('')}${pen.map(g => fila(g, '⏳ Sin responder')).join('')}${nov.map(g => fila(g, '❌ No va')).join('')}</tbody></table></div></div>`;
  $('#act').onclick = () => pConf();
}
async function guardar() {
  const b = $('#guardar'); b.disabled = true; $('#estado').textContent = 'Guardando…';
  try {
    const nuevoEv = !CODE;
    const r = await fetch('/api/fiesta?accion=' + (nuevoEv ? 'crear' : 'guardar'), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(nuevoEv ? {datos: D} : {f: CODE, k: K, datos: D})});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'No se pudo guardar');
    if (nuevoEv) { CODE = j.code; K = j.clave; history.replaceState(null, '', '/fiesta-panel?f=' + CODE + '&k=' + K); await cargar(); avisoPanel(); }
    else { D.invitados = j.invitados; sucio = false; guardarMis(); pintar(); $('#estado').innerHTML = '<span class="ok">✅ Guardado</span>'; }
    sucio = false;
  } catch (e) { $('#estado').textContent = '⚠️ ' + e.message; b.disabled = false; }
}
function avisoPanel() {
  const url = location.origin + '/fiesta-panel?f=' + CODE + '&k=' + K;
  $('#modalIn').innerHTML = `<h3 style="margin-top:0">🎉 ¡Tu fiesta quedó guardada!</h3><p>Este es <b>tu panel</b>. Guardá el link: con él entrás a cambiar la invitación y ver quién confirmó. No lo compartas con los invitados.</p>
    <p><code>${esc(url)}</code></p><p><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent('Mi panel de ShopFiesta: ' + url)}" target="_blank" rel="noopener">📲 Mandármelo por WhatsApp</a> <button class="btn alt" data-copy="${esc(url)}">📋 Copiar</button></p>
    <p class="muted">La invitación para los invitados es otra: ${esc(linkGeneral())}. Cada invitado recibe su propio link desde la pestaña Invitados.</p><button class="btn" id="cerrar">Seguir</button>`;
  $('#modal').classList.add('on'); $('#cerrar').onclick = () => $('#modal').classList.remove('on');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (!b) return; navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy).then(() => { const t = b.textContent; b.textContent = '✅'; setTimeout(() => b.textContent = t, 1500); }); });
addEventListener('beforeunload', e => { if (sucio) { e.preventDefault(); e.returnValue = ''; } });
inicio();
</script>
</body>
</html>
