document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')ir(cur+1,1);if(e.key==='ArrowLeft')ir(cur-1,-1);});
// deslizar con el dedo
let x0=null,y0=null;$('#libro').addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
$('#libro').addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)ir(cur+(dx<0?1:-1),dx<0?1:-1);},{passive:true});
let rz=null;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const s=HOJAS[cur]&&HOJAS[cur].sec;armar();ir(Math.min(cur,HOJAS.length-1),0);},250);});
// ---------- clicks ----------
const prod=id=>P.find(p=>p.id===id);
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-add]');if(a){e.stopPropagation();agregar(a.dataset.add);return;}
 const g=e.target.closest('[data-ir]');if(g){cerrarVelo();ir(+g.dataset.ir,+g.dataset.ir>cur?1:-1);return;}
 const ac=e.target.closest('[data-acc]');if(ac){if(ac.dataset.acc==='resena')resena();return;}
 const p=e.target.closest('[data-p]');if(p&&!e.target.closest('.velo')){ver(p.dataset.p);return;}
});
function velo(html){cerrarVelo();const v=document.createElement('div');v.className='velo';v.innerHTML=`<div class="panel"><button class="x" aria-label="Cerrar">✕</button>${html}</div>`;v.onclick=e=>{if(e.target===v||e.target.closest('.x'))cerrarVelo();};document.body.appendChild(v);return v;}
function cerrarVelo(){document.querySelectorAll('.velo').forEach(v=>v.remove());}
function ver(id){const p=prod(id);if(!p)return;const fs=(p.features||[]).slice(0,5);
 const v=velo(`<div class="big" style="background-image:url('${esc(p.img)}')"></div><h3 style="margin-top:10px">${esc(p.name)}</h3>${p.price?`<div style="font-size:24px;font-weight:900;color:#c8008f">${esc(p.price)}</div>`:''}${fs.length?`<ul style="margin:6px 0;padding-left:18px;color:#5a4060">${fs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<div class="acc"><button class="pri" id="vAdd">🛒 Agregar</button>${B.wa?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${esc(String(B.wa).replace(/\D/g,''))}?text=${encodeURIComponent('¡Hola! Me interesa: '+p.name+(p.price?' ('+p.price+')':'')+' — lo vi en tu revista')}">💬 Lo quiero (WhatsApp)</a>`:''}</div>`);
 v.querySelector('#vAdd').onclick=()=>{agregar(id);cerrarVelo();};}
// ---------- carrito ----------
const guardaC=()=>{try{localStorage.setItem('rev-'+SLUG,JSON.stringify(CARRO));}catch(e){}};
function agregar(id){const p=prod(id);if(!p)return;CARRO[id]=(CARRO[id]||0)+1;guardaC();pintaCarro();if(navigator.vibrate)navigator.vibrate(40);decir(`¡Agregué ${p.name}! ¿Algo más?`,3200);}
function itemsC(){return Object.entries(CARRO).map(([id,q])=>({p:prod(id),q})).filter(x=>x.p&&x.q>0);}
function totalC(){return itemsC().reduce((s,x)=>s+precioN(x.p.price)*x.q,0);}
function pintaCarro(){const n=itemsC().reduce((s,x)=>s+x.q,0),b=$('#bCarro');b.style.display=n?'block':'none';b.textContent=`🛒 ${n} · ${fmt(totalC())}`;}
$('#bCarro').onclick=carro;
let MP=null;async function mpOk(){if(MP!==null)return MP;try{const r=await fetch('/api/mpcobro?accion=disponible&slug='+encodeURIComponent(SLUG));const j=await r.json();MP=!!(j&&j.ok);}catch(e){MP=false;}return MP;}
async function carro(){
 const L=itemsC();if(!L.length){decir('Todavía no agregaste nada. Tocá el + de lo que te guste.');return;}
 const mp=await mpOk();
 const v=velo(`<h3>🛒 Tu pedido</h3>${L.map(x=>`<div class="fila"><span>${x.q} × ${esc(x.p.name)}<br><small style="color:#8a7690">${esc(x.p.price||'')}</small></span><button data-m="${esc(x.p.id)}">−</button><button data-s="${esc(x.p.id)}">+</button></div>`).join('')}<div style="text-align:right;font-weight:900;font-size:19px;margin:8px 0">Total: ${fmt(totalC())}</div>
 <input class="t" id="cNom" placeholder="Tu nombre" value="${esc(localStorage.getItem('rev-nombre')||'')}"><input class="t" id="cTel" placeholder="Tu WhatsApp (opcional)" inputmode="tel" value="${esc(localStorage.getItem('rev-tel')||'')}">
 <div class="acc">${mp?'<button class="pri" id="pMP">💳 Pagar ahora con Mercado Pago</button>':''}<button class="sec" id="pCaja">🏪 Pago en la caja del local</button>${B.wa?'<button class="wa" id="pWA">💬 Pedir por WhatsApp</button>':''}</div><div id="cMsg" style="text-align:center;color:#8a7690;margin-top:8px;font-size:14px"></div>`);
 v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{CARRO[b.dataset.m]--;if(CARRO[b.dataset.m]<=0)delete CARRO[b.dataset.m];guardaC();pintaCarro();itemsC().length?carro():cerrarVelo();});
 v.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{CARRO[b.dataset.s]++;guardaC();pintaCarro();carro();});
 const datos=()=>{const n=v.querySelector('#cNom').value.trim(),t=v.querySelector('#cTel').value.trim();try{localStorage.setItem('rev-nombre',n);localStorage.setItem('rev-tel',t);}catch(e){}return {nombre:n,tel:t};};
 const enviar=async(envio,pagaYa)=>{const d=datos();if(!d.nombre){v.querySelector('#cMsg').textContent='Poné tu nombre así sabemos de quién es el pedido 😊';return null;}
  v.querySelector('#cMsg').textContent='Enviando tu pedido…';const L2=itemsC(),t=totalC();
  try{const r=await fetch('/api/pedidos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:SLUG,items:L2.map(x=>({n:x.p.name,q:x.q,p:x.p.price||'',id:x.p.id})),total:fmt(t),total_n:Math.round(t*100)/100,moneda:'ARS',envio:envio[1],envio_id:envio[0],demora:B.delay||'',comprador:{nombre:d.nombre,tel:d.tel,dir:'',ref:'',turno:'',horario:'',lugar:''},servicio:false,regalo:null,pago:pagaYa?'Mercado Pago':'En el local',paga_ahora:!!pagaYa})});if(!r.ok)throw 0;const j=await r.json();try{localStorage.setItem('rev-ult',JSON.stringify({ref:j.ref,k:j.k}));}catch(e){}return j;}
  catch(e){v.querySelector('#cMsg').textContent='No se pudo enviar. Revisá internet y probá de nuevo.';return null;}};
 const pm=v.querySelector('#pMP');if(pm)pm.onclick=async()=>{pm.disabled=true;const j=await enviar(['retiro','Retiro en el local'],true);if(!j||!j.ref){pm.disabled=false;return;}
  let m={};try{m=await (await fetch('/api/mpcobro?accion=pagar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:j.ref,k:j.k,slug:SLUG,tienda:B.name||''})})).json();}catch(e){}
  if(!m.url){v.querySelector('#cMsg').textContent=(m.error||'Mercado Pago no respondió.')+' Podés pagar en la caja o por WhatsApp.';pm.disabled=false;return;}
  CARRO={};guardaC();pintaCarro();decir('¡Perfecto! Te llevo a Mercado Pago.');setTimeout(()=>location.href=m.url,1200);};
 v.querySelector('#pCaja').onclick=async()=>{const j=await enviar(['enlocal','Pago en el local'],false);if(!j||!j.ref)return;const lista=L.map(x=>`${x.q} × ${esc(x.p.name)}`).join('<br>');CARRO={};guardaC();pintaCarro();
  velo(`<div style="text-align:center"><h3>🧾 Mostrá esto en la caja</h3><div style="font-size:64px;font-weight:900;color:#0f766e;line-height:1.1">#${esc(String(j.turno||j.ref.split('/').pop().slice(-4).toUpperCase()))}</div><p style="color:#5a4060">${lista}</p><b style="font-size:20px">Total: ${fmt(totalC()||0)||''}</b><div class="acc"><button class="sec" data-acc="resena">⭐ Dejanos tu opinión</button></div></div>`);decir('¡Listo! Mostrá este número en la caja y te cobran ahí.');};
 const pw=v.querySelector('#pWA');if(pw)pw.onclick=()=>{const d=datos();const tx='¡Hola! Quiero hacer este pedido de tu revista:\n'+L.map(x=>`• ${x.q} × ${x.p.name}${x.p.price?' ('+x.p.price+')':''}`).join('\n')+`\nTotal: ${fmt(totalC())}`+(d.nombre?`\nSoy ${d.nombre}`:'');open('https://wa.me/'+String(B.wa).replace(/\D/g,'')+'?text='+encodeURIComponent(tx),'_blank','noopener');};
}
// ---------- reseña ----------
function resena(){let u=null;try{u=JSON.parse(localStorage.getItem('rev-ult')||'null');}catch(e){}
 const v=velo(`<h3>⭐ ¿Cómo te fue?</h3><div class="estrellas">${[1,2,3,4,5].map(i=>`<span data-e="${i}">⭐</span>`).join('')}</div><input class="t" id="rTx" placeholder="Contanos en una frase (opcional)"><div class="acc"><button class="pri" id="rOk">Enviar</button></div><div id="rMsg" style="text-align:center;color:#8a7690;margin-top:6px"></div>`);let e=0;
 v.querySelectorAll('[data-e]').forEach(s=>s.onclick=()=>{e=+s.dataset.e;v.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('on',+x.dataset.e<=e));});
 v.querySelector('#rOk').onclick=async()=>{if(!e){v.querySelector('#rMsg').textContent='Tocá las estrellas 😊';return;}
  if(u&&u.ref){try{await fetch('/api/pedidos?accion=resena',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ref:u.ref,k:u.k,estrellas:e,texto:v.querySelector('#rTx').value,nombre:localStorage.getItem('rev-nombre')||''})});}catch(er){}}
  v.querySelector('.panel').innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:48px">💖</div><h3>¡Gracias por tu opinión!</h3>${B.greview?`<div class="acc"><a class="pri" target="_blank" rel="noopener" href="${esc(B.greview)}">⭐ Dejala también en Google</a></div>`:''}</div>`;decir('¡Muchas gracias! Nos ayuda muchísimo.');};}
// ---------- ver todo (miniaturas) ----------
$('#bTodo').onclick=()=>{const v=velo(`<h3>📖 Toda la revista</h3><div class="mini">${HOJAS.map((h,i)=>`<button data-ir="${i}"><i>${(h.items||[]).slice(0,4).map(p=>`<span style="background-image:url('${esc(p.img)}')"></span>`).join('')||'<span style="grid-column:1/3;background:#f6e6f1;display:grid;place-items:center;font-size:26px">📖</span>'}</i><b>${i===0?'Tapa':h.tipo==='fin'?'Final':esc(h.tit)+(h.de>1?' '+h.pg:'')}</b></button>`).join('')}</div>`);};
// ---------- buscar / Flashy ----------
function buscar(q){const n=norm(q);if(!n)return false;
 if(/\b(oferta|ofertas|promo|descuento)/.test(n)){const i=HOJAS.findIndex(h=>h.sec==='ofertas');if(i>0){ir(i,1);decir('¡Acá están las ofertas! 🔥');return true;}}
 if(/\b(pagar|carrito|comprar|pedido|cuenta)\b/.test(n)){carro();return true;}
 if(/\b(tapa|inicio|principio)\b/.test(n)){ir(0,-1);return true;}
 if(/\b(whatsapp|hablar|vendedor|duenio|dueño)\b/.test(n)&&B.wa){open('https://wa.me/'+String(B.wa).replace(/\D/g,''),'_blank','noopener');return true;}
 if(/\b(como llego|direccion|donde queda|ubicacion)\b/.test(n)&&B.addr){open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(B.addr),'_blank','noopener');return true;}
 const w=n.replace(/\b(mandame|llevame|ir|a|las|los|la|el|de|del|tenes|tienen|hay|quiero|busco|buscame|mostrame|por favor|una|un|unos|unas|que|me|flashy)\b/g,' ').trim().split(' ').filter(x=>x.length>2);if(!w.length)return false;
 const hc=HOJAS.findIndex(h=>h.tit&&w.some(x=>norm(h.tit).includes(x.replace(/s$/,''))));
 const sc=p=>w.reduce((s,x)=>s+(norm(p.name).includes(x.replace(/s$/,''))?2:0)+((p.features||[]).some(f=>norm(f).includes(x))?1:0),0);
 const best=P.map(p=>[sc(p),p]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0])[0];
 if(best&&(!(hc>0)||best[0]>=2)){const p=best[1],i=HOJAS.findIndex(h=>(h.items||[]).some(x=>x.id===p.id&&h.sec!=='ofertas'));const j=i>0?i:HOJAS.findIndex(h=>(h.items||[]).some(x=>x.id===p.id));ir(j,j>cur?1:-1,p.id);decir(`¡Sí! Te lo muestro: ${p.name}${p.price?', a '+p.price:''}.`);return true;}
 if(hc>0){ir(hc,hc>cur?1:-1);decir(`¡Ya voy! Acá tenés ${HOJAS[hc].tit}.`);return true;}
 decir('Uy, eso no lo encontré en la revista 🤔 Probá con otra palabra o escribinos por WhatsApp.');return true;}
$('#busca').addEventListener('keydown',e=>{if(e.key==='Enter'){buscar(e.target.value);e.target.blur();}});
$('#fla').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const v=velo(`<h3>⚡ ¿Qué buscás?</h3><input class="t" id="fQ" placeholder="Ej: mandame a las bebidas · ¿tenés yerba? · ofertas"><div class="acc"><button class="pri" id="fGo">Buscar</button>${SR?'<button class="sec" id="fMic">🎙️ Decímelo hablando</button>':''}<button class="sec" data-ir="0">📖 Ir a la tapa</button><button class="sec" id="fCarro">🛒 Ver mi pedido</button></div>`);
 const go=()=>{const q=v.querySelector('#fQ').value;cerrarVelo();buscar(q);};v.querySelector('#fGo').onclick=go;v.querySelector('#fQ').addEventListener('keydown',e=>{if(e.key==='Enter')go();});v.querySelector('#fCarro').onclick=()=>{cerrarVelo();carro();};
 const m=v.querySelector('#fMic');if(m)m.onclick=()=>{const r=new SR();r.lang='es-AR';m.textContent='🎙️ Te escucho…';r.onresult=e=>{cerrarVelo();buscar(e.results[0][0].transcript);};r.onend=()=>{m.textContent='🎙️ Decímelo hablando';};r.start();};
 setTimeout(()=>v.querySelector('#fQ').focus(),100);};
cargar();
</script></body></html>
