 b.onclick=e=>{e.stopPropagation();if(musOn){musApagar();try{localStorage.setItem('rev-mus','0');}catch(_){}}else{musPrender();try{localStorage.setItem('rev-mus','1');}catch(_){}}};
 const primero=()=>{document.removeEventListener('pointerdown',primero,true);if(quiere&&!musOn)musPrender();};document.addEventListener('pointerdown',primero,true);
 document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(musOn)ac.resume();});}
/* ---- Flashy: recorre la revista, ofertas, lo último, cómo pagar y consejos ---- */
let tourOn=false,tourT=null,quieto=0;
const precioTxt=p=>p.price?(' a '+p.price):'';
function tourParar(msg){if(!tourOn)return;tourOn=false;clearTimeout(tourT);setTimeout(volverRincon,300);if(msg)decir(msg,3500);}
function tourPaso(){if(!tourOn)return;const sig=cur+1;
 if(sig>=HOJAS.length-1){tourOn=false;ir(HOJAS.length-1,1);decir('¡Esa fue toda la revista! Si algo te gustó, tocalo y lo agregás 🛒',6000);return;}
 const h=HOJAS[sig];let t='';const e=h&&h.items?(h.items[Math.floor(Math.random()*h.items.length)]||h.items[0]):null;ir(sig,1,e&&e.id);if(e)setTimeout(()=>volarAEl(document.querySelector(`.pr[data-p="${CSS.escape(e.id)}"]`),1.2),600);
 if(h&&h.tipo==='prods'){t=(h.pg===1?`Acá tenés ${h.tit}. `:`Más de ${h.tit}. `)+(e?`Mirá: ${e.name}${precioTxt(e)}.`:'');}
 decir(t||'Seguimos…',4200,['Parar','parar']);tourT=setTimeout(tourPaso,5200);}
function flHacer(q){
 if(q==='parar'){tourParar('Listo, te dejo mirar tranquilo 😉');return;}
 if(q==='nada')return;
 if(q.startsWith('ver:')){clearTimeout(window.__vr);volverRincon();ver(q.slice(4));return;}
 if(q.startsWith('add:')){const id=q.slice(4);tourOn=false;clearTimeout(tourT);agregar(id);const n=itemsC().reduce((s,x)=>s+x.q,0);decir(`¡Listo, te lo agregué! 🛒 Llevás ${n} ${n===1?'cosa':'cosas'}${totalC()?' · '+fmt(totalC()):''}. ¿Seguimos mirando o vamos a pagar?`,12000,secSt&&secSt.k<secSt.its.length?[['▶ Seguir mirando','seguir'],['🛒 Ir a pagar','pagar']]:[['🛒 Ir a pagar','pagar'],['Seguir mirando','nada']]);return;}
 if(q==='seguir'||q==='sig'){if(secSt&&(cur===secSt.i||secSt.paso)){clearTimeout(tourT);tourOn=true;secSt.paso();}return;}
 if(q==='pagar'){if(!itemsC().length){decir('Todavía no agregaste nada 🙂 Tocá el + de lo que te guste, o decime "lo quiero" cuando te lo muestre.',6000);return;}mpOk().then(mp=>{decir('¿Cómo querés pagar? 💳'+(mp?' Te puedo cobrar yo con Mercado Pago,':'')+' podés pagar en la caja del local'+(B.wa?' o pedirlo por WhatsApp':'')+'. Elegí abajo 👇',9000);carro();});return;}
 if(q==='tour'){tourOn=true;if(cur!==0)ir(0,-1);decir('¡Dale! Te muestro la revista hoja por hoja. Tocá la pantalla cuando quieras parar.',3800,['Parar','parar']);tourT=setTimeout(tourPaso,4200);return;}
 if(q==='ofertas'){const of=P.filter(p=>p.featured);const lista=(of.length?of:P.filter(p=>p.price).sort((a,b)=>precioN(a.price)-precioN(b.price))).slice(0,3);
  const i=HOJAS.findIndex(h=>h.sec==='ofertas');if(i>0)ir(i,1);else if(lista[0])irA(lista[0]);
  decir(lista.length?(of.length?'🔥 Ofertas de hoy: ':'💸 Lo más barato de hoy: ')+lista.map(p=>p.name+precioTxt(p)).join(' · '):'Hoy no hay ofertas marcadas, pero mirá la revista 😉',8000);return;}
 if(q==='nuevo'){const ult=P.slice(-3).reverse();if(!ult.length)return;irA(ult[0]);decir('🆕 Lo último que llegó: '+ult.map(p=>p.name+precioTxt(p)).join(' · '),8000);return;}
 if(q==='pago'){mpOk().then(mp=>{const f=[];if(mp)f.push('con Mercado Pago ahora mismo (tarjeta, débito o saldo)');f.push('en la caja: te doy un número y pagás al retirar');if(B.wa)f.push('o por WhatsApp, coordinando con el negocio');decir('💳 Podés pagar '+f.join(', ')+'. Agregá lo que quieras y tocá el carrito 🛒',9000,itemsC().length?['Ver mi pedido','carro']:null);});return;}
 if(q==='carro'){carro();return;}
 if(q==='llegar'&&B.addr){open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(B.addr),'_blank','noopener');return;}
}
function irA(p){const i=HOJAS.findIndex(h=>h.items&&h.items.some(x=>x.id===p.id));if(i>0)ir(i,i>cur?1:-1,p.id);}
function flConsejo(){if(tourOn||document.querySelector('.velo')||$('#globo').style.display==='block'||EDITAR)return;
 const ops=[['¿Querés que te muestre la revista hoja por hoja?',['Sí, mostrame','tour']],['🔥 ¿Te cuento las ofertas de hoy?',['Contame','ofertas']],['🆕 ¿Querés ver lo último que llegó?',['Mostrame','nuevo']],['💳 ¿Querés saber cómo podés pagar?',['Contame','pago']]];
 if(itemsC().length)ops.push(['🛒 Ya tenés cosas en tu pedido. ¿Lo terminamos?',['Ver mi pedido','carro']]);
 const o=ops[Math.floor(Math.random()*ops.length)];$('#fla').classList.add('mira');setTimeout(()=>$('#fla').classList.remove('mira'),2200);decir(o[0],7000,o[1]);}
$('#globo').addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-ga]');const a=b?b.dataset.ga:(gAcc&&gAcc.length===1?gAcc[0][1]:null);if(!a)return;$('#globo').style.display='none';flHacer(a);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.velo.liviano .panel')&&!e.target.closest('#fla'))document.querySelectorAll('.velo.liviano').forEach(v=>v.remove());},true);
document.addEventListener('pointerdown',e=>{quieto=0;if(tourOn&&!e.target.closest('#globo'))tourParar('Listo, te dejo mirar tranquilo 😉');},true);
setInterval(()=>{quieto+=5;if(quieto===15||(quieto>15&&quieto%35===0))flConsejo();},5000);
/* Flashy te muestra una sección producto por producto */
let secSt=null;
function secTour(i){tourParar();const h=HOJAS[i];if(!h)return;tourOn=true;ir(i,i>cur?1:-1);
 const its=(h.items||[]).slice().sort((a,b)=>(b.featured?1:0)-(a.featured?1:0)).slice(0,8);let k=0;
 const marca=id=>{document.querySelectorAll('.pr.hl').forEach(e=>e.classList.remove('hl'));const e=document.querySelector(`.pr[data-p="${CSS.escape(id)}"]`);if(e){e.classList.add('hl');e.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>volarAEl(e,1.3),250);}};
 decir(`¡Ya voy! En ${h.tit} tenés ${h.de>1?'varias hojas de cosas':its.length+' cosas'}. Te las muestro 👇`,3000,['Parar','parar']);
 const paso=()=>{secSt.k=k;if(!tourOn||cur!==i)return;if(k>=its.length){tourOn=false;document.querySelectorAll('.pr.hl').forEach(e=>e.classList.remove('hl'));decir(h.de>1?`Eso es lo primero de ${h.tit}. Pasá la hoja para ver más 👉 ¿Te gustó algo? Tocalo y lo agregás 🛒`:'¿Te gustó alguno? Tocalo y lo agregás al pedido 🛒',7000);return;}
  const p=its[k++];secSt.k=k;if(k>=its.length)setTimeout(volverRincon,5000);marca(p.id);decir((p.featured?'🔥 Oferta: ':'')+p.name+(p.price?' a '+p.price:'')+(p.desc?'. '+p.desc:''),5600,[['➕ Lo quiero','add:'+p.id],['Siguiente ▶','sig'],['⏸','parar']]);tourT=setTimeout(paso,5800);};
 secSt={i,its,k:0,paso};tourT=setTimeout(paso,3300);}
/* ---- Flashy vuela con estela de brillitos ---- */
const QUIETO=matchMedia('(prefers-reduced-motion: reduce)').matches;
function chispas(x,y,n,big){for(let i=0;i<n;i++){const c=document.createElement('span');c.className='chis';c.textContent=['✨','⭐','✦','💖','✨'][Math.floor(Math.random()*5)];c.style.left=(x-8+Math.random()*16)+'px';c.style.top=(y-8+Math.random()*16)+'px';const a=Math.random()*Math.PI*2,r=(big?60:20)+Math.random()*(big?70:30);c.style.setProperty('--dx',Math.cos(a)*r+'px');c.style.setProperty('--dy',(Math.sin(a)*r+(big?0:18))+'px');c.style.fontSize=(10+Math.random()*(big?14:8))+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),950);}}
let vT=null,estela=null;
function vuelo(on){clearInterval(estela);if(!on)return;estela=setInterval(()=>{const r=$('#fla').getBoundingClientRect();chispas(r.left+r.width/2,r.top+r.height*.75,2);},55);}
function volarA(x,y,esc,ms){if(QUIETO)return;const f=$('#fla');f.classList.add('vuela');f.style.translate='0 0';const r=f.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
 const prev=(f.style.translate||'0 0').split(' ').map(parseFloat);f.style.translate=((x-cx)+(prev[0]||0))+'px '+((y-cy)+(prev[1]||0))+'px';f.style.scale=esc||1;vuelo(true);clearTimeout(vT);vT=setTimeout(()=>vuelo(false),1000);}
let fx0=0,fy0=0;
function volarAEl(e,esc){if(!e||QUIETO)return;const f=$('#fla');const t=e.getBoundingClientRect();f.style.transition='none';f.style.translate='0 0';f.style.scale=1;const r=f.getBoundingClientRect();void f.offsetWidth;f.style.transition='';
 let x=t.right-10,y=t.top+t.height/2;if(x+60>innerWidth)x=t.left-40;y=Math.max(70,Math.min(innerHeight-120,y));
 f.classList.add('vuela');f.style.translate=(x-(r.left+r.width/2))+'px '+(y-(r.top+r.height/2))+'px';f.style.scale=esc||1.25;vuelo(true);clearTimeout(vT);vT=setTimeout(()=>{vuelo(false);const q=f.getBoundingClientRect();chispas(q.left+q.width/2,q.top+q.height/2,10,true);},980);}
function volverRincon(){const f=$('#fla');if(!f.style.translate||f.style.translate==='0px 0px'||f.style.translate==='0px')return;f.classList.add('vuela');f.style.translate='0px 0px';f.style.scale=1;vuelo(true);clearTimeout(vT);vT=setTimeout(()=>vuelo(false),1000);}
function entrada(){if(QUIETO||EDITAR)return;const f=$('#fla');f.style.transition='none';const r=f.getBoundingClientRect();f.style.translate=(innerWidth/2-(r.left+r.width/2))+'px '+(innerHeight*.42-(r.top+r.height/2))+'px';f.style.scale=0.1;void f.offsetWidth;f.style.transition='';f.classList.add('vuela');
 setTimeout(()=>{f.style.scale=2.3;chispas(innerWidth/2,innerHeight*.42,26,true);},150);
 setTimeout(()=>{chispas(innerWidth/2,innerHeight*.42,14,true);},700);
 setTimeout(volverRincon,3400);}
/* Tocás un producto: Flashy vuela al lado y te lo presenta */
function elegir(id,el){const p=prod(id);if(!p)return;if(EDITAR){ver(id);return;}tourParar();document.querySelectorAll('.pr.hl').forEach(e=>e.classList.remove('hl'));if(el)el.classList.add('hl');volarAEl(el,1.3);
 decir(`${p.featured?'🔥 ¡Está en oferta! ':''}${p.name}${p.price?' a '+p.price:''}. ${p.desc||'¡Buena elección!'} ¿Lo querés?`,10000,[['➕ Lo quiero','add:'+id],['🔍 Verlo grande','ver:'+id]]);clearTimeout(window.__vr);window.__vr=setTimeout(volverRincon,10500);}
/* Varios productos: los muestra de a uno, aunque estén en hojas distintas */
function listaTour(its,intro){tourParar();tourOn=true;let k=0;
 const hojaDe=p=>{const i=HOJAS.findIndex(h=>h.sec!=='ofertas'&&(h.items||[]).some(x=>x.id===p.id));return i>0?i:HOJAS.findIndex(h=>(h.items||[]).some(x=>x.id===p.id));};
 const paso=()=>{secSt.k=k;if(!tourOn)return;if(k>=its.length){tourOn=false;document.querySelectorAll('.pr.hl').forEach(e=>e.classList.remove('hl'));setTimeout(volverRincon,400);decir('¿Cuál te gustó? Tocalo y lo agregás 🛒',6000);return;}
  const p=its[k++];secSt.k=k;const i=hojaDe(p);const sigue=()=>{secSt.i=cur;const e=document.querySelector(`.pr[data-p="${CSS.escape(p.id)}"]`);document.querySelectorAll('.pr.hl').forEach(x=>x.classList.remove('hl'));if(e){e.classList.add('hl');e.scrollIntoView({block:'nearest',behavior:'smooth'});setTimeout(()=>volarAEl(e,1.3),250);}
   decir((p.featured?'🔥 Oferta: ':'')+p.name+(p.price?' a '+p.price:'')+(p.desc?'. '+p.desc:''),5600,[['➕ Lo quiero','add:'+p.id],['Siguiente ▶','sig'],['⏸','parar']]);tourT=setTimeout(paso,5800);};
  if(i>0&&i!==cur){ir(i,i>cur?1:-1);setTimeout(sigue,450);}else sigue();};
 secSt={i:cur,its,k:0,paso};decir(intro,3600,['Parar','parar']);tourT=setTimeout(paso,3400);}
cargar();
</script></body></html>
