<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mi panel de vendedor · ShopFlash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/vend.css">
</head>
<body>
<main class="wrap" id="app">
  <div class="top"><a href="/">ShopFlash</a> · <span style="font-weight:600">Panel de vendedor</span></div>
  <p class="msg" id="msg" role="status">Cargando tu panel…</p>
</main>
<script>
(function(){
  const $ = id => document.getElementById(id), fmt = n => '$' + Number(n || 0).toLocaleString('es-AR');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fecha = d => { try{ return new Date(d).toLocaleDateString('es-AR'); }catch(e){ return ''; } };
  // QR propio del vendedor: lleva su link con el código, así cada comercio que lo escanea y se anota queda como su cliente
  const loadQR = () => window.qrcode ? Promise.resolve() : new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js'; sc.onload = ok; sc.onerror = ko; document.head.appendChild(sc); });
  async function qrTarjeta(link, code, nombre){
    await loadQR(); await (document.fonts ? document.fonts.ready : Promise.resolve());
    const q = qrcode(0, 'M'); q.addData(link); q.make();
    const W = 1000, H = 1500, c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6d28d9'); g.addColorStop(.55, '#9333ea'); g.addColorStop(1, '#db2777'); x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.14)'; x.fillRect(0, 0, W, 210);
    x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = '800 92px "Bricolage Grotesque", system-ui, sans-serif'; x.fillText('⚡ ShopFlash', W / 2, 135);
    x.fillStyle = '#fff'; x.font = '700 54px "Bricolage Grotesque", system-ui, sans-serif'; x.fillText('Tu tienda online', W / 2, 315); x.fillText('con solo una foto', W / 2, 380);
    const n = q.getModuleCount(), size = 640, cell = Math.floor(size / n), qs = cell * n, ox = (W - qs) / 2, oy = 440;
    x.fillStyle = '#fff'; x.beginPath(); x.roundRect ? x.roundRect(ox - 40, oy - 40, qs + 80, qs + 80, 36) : x.rect(ox - 40, oy - 40, qs + 80, qs + 80); x.fill();
    x.fillStyle = '#111'; for(let r = 0; r < n; r++) for(let k = 0; k < n; k++) if(q.isDark(r, k)) x.fillRect(ox + k * cell, oy + r * cell, cell, cell);
    const yb = oy + qs + 120;
    x.fillStyle = '#fff'; x.font = '700 52px Figtree, system-ui, sans-serif'; x.fillText('📲 Escaneá y probala', W / 2, yb); x.fillText('7 días GRATIS', W / 2, yb + 66);
    x.fillStyle = '#cffafe'; x.font = '500 38px Figtree, system-ui, sans-serif';
    if(nombre) x.fillText('Te la recomienda: ' + nombre, W / 2, yb + 150);
    x.font = '500 34px "IBM Plex Mono", monospace'; x.fillText('Código de vendedor: ' + code, W / 2, yb + (nombre ? 210 : 150));
    return c.toDataURL('image/png');
  }
  async function qrMostrar(box, link, code, nombre){
    try{
      const url = await qrTarjeta(link, code, nombre);
      box.innerHTML = `<img src="${url}" alt="Tu código QR de vendedor" style="width:100%;max-width:300px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:block;margin:6px auto">
        <div class="row" style="justify-content:center"><a class="btn primary" href="${url}" download="ShopFlash_QR_${code}.png">⬇ Descargar mi QR</a><button class="btn" type="button" data-qrprint>🖨 Imprimir</button><button class="btn wa" type="button" data-qrshare>Compartir</button></div>
        <p class="note">Tamaño ideal para imprimir: 10 x 15 cm (como una foto). Llevalo a los comercios o dejalo pegado en el mostrador: cada comercio que lo escanee y se anote queda como tu cliente.</p>`;
      box.querySelector('[data-qrprint]').onclick = () => { const w = open(''); if(!w) return; w.document.write(`<html><head><title>QR ShopFlash</title><style>@page{size:10cm 15cm;margin:0}body{margin:0}img{width:10cm;height:15cm;display:block}</style></head><body><img src="${url}" onload="setTimeout(()=>print(),200)"></body></html>`); w.document.close(); };
      box.querySelector('[data-qrshare]').onclick = async () => { try{ const f = new File([await (await fetch(url)).blob()], `ShopFlash_QR_${code}.png`, {type: 'image/png'}); if(navigator.canShare && navigator.canShare({files: [f]})) await navigator.share({files: [f], text: 'Probá ShopFlash 7 días gratis 👉 ' + link}); else location.href = 'https://wa.me/?text=' + encodeURIComponent('Probá ShopFlash 7 días gratis 👉 ' + link); }catch(e){} };
    }catch(e){ box.innerHTML = '<p class="note">No se pudo armar el QR. Revisá tu conexión y recargá la página.</p>'; }
  }
  // textos listos para publicar (llevan el link del vendedor)
  const TEXTOS = link => [
    {titulo: 'Para tu estado de WhatsApp', texto: '¿Vendés algo? 📸 Sacale una foto y ShopFlash te arma tu tienda solita: vitrinas que giran, precios y pedidos por WhatsApp. Probala 7 días gratis 👉 ' + link},
    {titulo: 'Para grupos de emprendedores', texto: 'Hola a todos 👋 Quería compartirles una herramienta que me parece re útil para los que venden: ShopFlash.\n\nSacás una foto del producto y se carga solo, con nombre y características. Tus clientes ven tus productos en vitrinas que giran en 360°, eligen y te hacen el pedido. Sin saber nada de computación.\n\nSe puede probar 7 días gratis: ' + link},
    {titulo: 'Para revendedoras de catálogo', texto: '¿Revendés Avon, Natura, Violetta u otra marca? 💄 Con ShopFlash subís la foto de la página del catálogo y la app separa cada producto con su precio. Tus clientas ven todo en tu propia tienda y te hacen el pedido por WhatsApp.\n\nProbala 7 días gratis 👉 ' + link},
    {titulo: 'Para Instagram o Facebook', texto: 'Tu local, ahora en el celular de tus clientes 🛍️\n\n✅ Sacás una foto y el producto se carga solo\n✅ Vitrinas que giran en 360°\n✅ Una cajera virtual que atiende y toma los pedidos\n✅ Pedidos y pagos sin complicaciones\n\nProbá ShopFlash gratis 7 días 👉 ' + link}
  ];
  // videos e imágenes del kit: se cargan desde /kit/kit.json (así se suman videos sin tocar esta página)
  async function compartirArchivo(url, nombre, texto, btn){
    try{
      const blob = await (await fetch(url)).blob(), f = new File([blob], nombre, {type: blob.type});
      if(navigator.canShare && navigator.canShare({files: [f]})){ await navigator.share({files: [f], text: texto}); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
    if(btn){ btn.textContent = 'Descargado ✓'; }
  }
  async function cargarKit(link){
    let k = {videos: [], imagenes: []};
    try{ k = await (await fetch('/kit/kit.json', {cache: 'no-cache'})).json(); }catch(e){}
    const corto = '¿Vendés algo? Armá tu tienda con una foto 👉 ' + link;
    const item = (x, i, tipo) => {
      const nombre = x.src.split('/').pop();
      const media = tipo === 'v' ? `<video src="${esc(x.src)}" controls playsinline preload="metadata"></video>` : `<img src="${esc(x.src)}" alt="${esc(x.titulo || '')}" loading="lazy">`;
      return `<div class="kitbox">${media}<b>${esc(x.titulo || '')}</b><div class="row"><button class="btn primary" type="button" data-kit="${tipo}${i}">Compartir</button><a class="btn" href="${esc(x.src)}" download="${esc(nombre)}">Descargar</a></div></div>`;
    };
    const vids = k.videos || [], imgs = k.imagenes || [];
    $('kitVideos').innerHTML = `<h3>Videos</h3>` + (vids.length ? `<div class="kitimg">${vids.map((x, i) => item(x, i, 'v')).join('')}</div>` : '<p class="note">Muy pronto vas a tener acá los videos listos para subir a tus estados y redes.</p>');
    $('kitImgs').innerHTML = imgs.map((x, i) => item(x, i, 'i')).join('');
    document.querySelectorAll('[data-kit]').forEach(b => b.onclick = () => {
      const t = b.dataset.kit[0], x = (t === 'v' ? vids : imgs)[+b.dataset.kit.slice(1)];
      compartirArchivo(x.src, x.src.split('/').pop(), corto, b);
    });
  }
  const p = new URLSearchParams(location.search), c = p.get('c'), k = p.get('k');
  if(!c || !k){ $('msg').textContent = 'Este link no es válido. Usá el link de tu panel que recibiste al anotarte.'; return; }
  const tag = e => e === 'pagando' ? '<span class="tag ok">Pagando ✅</span>' : e === 'en prueba gratis' ? '<span class="tag warn">En prueba gratis ⏳</span>' : `<span class="tag">${esc(e)}</span>`;
  fetch('/api/vendedores?accion=panel&c=' + encodeURIComponent(c) + '&k=' + encodeURIComponent(k)).then(r => r.json().then(j => ({ok: r.ok, j}))).then(({ok, j}) => {
    if(!ok){ $('msg').textContent = j.error || 'No se pudo abrir tu panel.'; return; }
    const share = 'https://wa.me/?text=' + encodeURIComponent('¿Tenés un emprendimiento o un local? Con ShopFlash tenés tu propia página web para vender en toda Argentina y en el exterior, con vitrinas que giran en 360° y vendedores virtuales. Probala 7 días gratis 👉 ' + j.link);
    const nuevo = p.get('nuevo') === '1';
    $('app').innerHTML = (nuevo ? `<section class="card"><h2>¡Bienvenido/a, ${esc(j.nombre.split(' ')[0])}! 🎉</h2><p class="lead">Esta página es <b>tu panel</b>: acá ves tus clientes, lo que ganás y tu material para publicar. Guardala para volver cuando quieras.</p><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Mi panel de vendedor de ShopFlash (no compartir): ' + location.href.replace('&nuevo=1', '').split('#')[0])}">Guardar mi panel en WhatsApp</a><a class="btn primary" href="#kit">Ir a mis videos y textos ↓</a></div></section>` : '') + `
      <div class="top"><a href="/">ShopFlash</a> · <span style="font-weight:600">Panel de vendedor</span></div>
      <h1>Hola, ${esc(j.nombre.split(' ')[0])} 👋</h1>
      <div class="grid3">
        <div class="stat"><span>Clientes pagando</span><b>${j.activos}</b></div>
        <div class="stat"><span>Te corresponde ahora</span><b class="money">${fmt(j.total)}</b></div>
        <div class="stat"><span>Ya cobraste en total</span><b>${fmt(j.cobrado)}</b></div>
      </div>
      <section class="card">
        <h2>Tu link para compartir</h2>
        <div class="link">${esc(j.link)}</div>
        <div class="row"><button class="btn primary" type="button" id="copy">Copiar mi link</button><a class="btn wa" href="${share}" target="_blank" rel="noopener">Compartir por WhatsApp</a></div>
        <p class="note">Tu código: <b>${esc(j.code)}</b>. Si alguien se anota sin tu link, puede escribir el código en “Mi cuenta” dentro de su tienda.</p>
      </section>
      <section class="card">
        <h2>📲 Tu código QR</h2>
        <p class="note">Lleva tu link adentro: el comercio lo escanea con la cámara del celular, se anota y te queda a vos.</p>
        <div id="qrBox"><p class="note">Armando tu QR…</p></div>
      </section>
      <section class="card" id="kit">
        <h2>Material para publicar</h2>
        <p class="note">Todo listo para copiar y publicar. Los textos ya llevan tu link, así que cada persona que se anote desde ahí te suma a vos.</p>
        <div class="kitv" id="kitVideos"></div>
        <h3>Textos</h3>
        <div class="kitt">${TEXTOS(j.link).map((t, i) => `<div class="kitbox"><b>${esc(t.titulo)}</b><p class="kittxt">${esc(t.texto).replace(/\n/g, '<br>')}</p>
          <div class="row"><button class="btn" type="button" data-copy="${i}">Copiar</button><a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(t.texto)}" target="_blank" rel="noopener">Mandar por WhatsApp</a></div></div>`).join('')}</div>
        <h3>Imágenes</h3>
        <div class="kitimg" id="kitImgs"></div>
      </section>
      <section class="card">
        <h2>Lo que te corresponde ahora</h2>
        ${j.debe.length ? `<div class="scroll"><table><thead><tr><th>Cliente</th><th>Plan</th><th>Concepto</th><th>Monto</th></tr></thead><tbody>${j.debe.map(d => `<tr><td>${esc(d.tienda)}</td><td>${esc(d.plan)}</td><td>${d.tipo === 'premio' ? 'Premio por venta' : 'Comisión del mes ' + esc(d.mes)}</td><td class="money">${fmt(d.monto)}</td></tr>`).join('')}</tbody></table></div><p class="note">ShopFlash te lo transfiere y acá vas a ver el pago marcado.</p>` : '<p class="note">Por ahora no hay nada pendiente. Cuando un cliente tuyo pague, aparece acá.</p>'}
      </section>
      <section class="card">
        <h2>Tus clientes (${j.clientes.length})</h2>
        ${j.clientes.length ? `<div class="scroll"><table><thead><tr><th>Tienda</th><th>Plan</th><th>Se anotó</th><th>Estado</th></tr></thead><tbody>${j.clientes.map(x => `<tr><td>${esc(x.tienda || x.email)}</td><td>${esc(x.plan)}</td><td>${fecha(x.desde)}</td><td>${tag(x.estado)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Todavía no se anotó nadie con tu link. ¡Compartilo!</p>'}
      </section>
      <section class="card">
        <h2>Pagos que recibiste</h2>
        ${j.pagos.length ? `<div class="scroll"><table><thead><tr><th>Fecha</th><th>Monto</th><th>Detalle</th></tr></thead><tbody>${j.pagos.map(pg => `<tr><td>${fecha(pg.fecha)}</td><td class="money">${fmt(pg.monto)}</td><td>${(pg.detalle || []).map(d => `${d.tipo === 'premio' ? 'Premio' : 'Mes ' + esc(d.mes)} · ${esc(d.tienda)} (${fmt(d.monto)})`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Todavía no hay pagos.</p>'}
      </section>
      <section class="card">
        <h2>Cuánto ganás</h2>
        <p class="note">Start: ${fmt(j.premios.emprendedora)} por venta + ${fmt(j.mensual.emprendedora)} por mes · Plus: ${fmt(j.premios.comercio)} + ${fmt(j.mensual.comercio)} por mes · Pro: ${fmt(j.premios.pro)} + ${fmt(j.mensual.pro)} por mes. El premio se gana cuando el cliente paga su primer mes; la comisión mensual, desde el mes siguiente y mientras siga pagando.</p>
      </section>`;
    const txts = TEXTOS(j.link);
    document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => navigator.clipboard?.writeText(txts[+b.dataset.copy].texto).then(() => { b.textContent = '¡Copiado!'; setTimeout(() => b.textContent = 'Copiar', 2000); }));
    cargarKit(j.link).then(() => { if(location.hash === '#kit') setTimeout(() => $('kit').scrollIntoView({behavior: 'smooth'}), 300); });
    qrMostrar($('qrBox'), j.link, j.code, (j.nombre || '').trim().split(/\s+/)[0]);
    $('copy').onclick = () => navigator.clipboard?.writeText(j.link).then(() => { $('copy').textContent = '¡Copiado!'; });
  }).catch(() => { $('msg').textContent = 'No se pudo abrir tu panel. Revisá tu conexión y probá de nuevo.'; });
})();
</script>
</body>
</html>
