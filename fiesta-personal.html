<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal · ShopEventos</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icons/fiesta-192.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#b08a2e;--bg:#f6f4ef;--card:#fff;--ink:#1f2937;--soft:#4b5563;--line:#e3ded2;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font:17px/1.45 'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fffdf8;border-bottom:1px solid var(--line);padding:10px 14px;position:sticky;top:0;z-index:5}
header b{font-size:18px}header small{display:block;color:var(--soft)}
.tabs{display:flex;gap:6px;padding:10px 12px 0;flex-wrap:wrap}
.tabs button{flex:1;min-width:30%;border:0;background:#ebe6da;font:800 16px 'Figtree',sans-serif;padding:12px 8px;border-radius:12px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ac);color:#fff}
main{padding:10px 12px 140px;max-width:900px;margin:0 auto}
.p{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.p.nuevo{border-left:8px solid #f59e0b}.p.camino{border-left:8px solid #3b82f6}.p.entregado{border-left:8px solid #16a34a;opacity:.75}
.mesa{font-size:30px;font-weight:800;line-height:1}.quien{color:var(--soft);font-size:15px}
.its{font-size:20px;font-weight:600;margin:8px 0}.nota{background:#fff7e0;border-radius:8px;padding:6px 8px;font-size:15px}
.hace{float:right;font-size:14px;color:var(--soft)}.tarde{color:#b91c1c;font-weight:800}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font:800 16px 'Figtree',sans-serif;cursor:pointer;background:var(--ac);color:#fff}
.btn.alt{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}.btn.ok{background:#16a34a}.btn.azul{background:#2563eb}.btn.sm{padding:8px 10px;font-size:14px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:700 15px 'Figtree',sans-serif;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.vacio{text-align:center;color:var(--soft);padding:40px 10px}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;z-index:6}
.herr{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.herr input{width:100%;font:16px 'Figtree',sans-serif;padding:11px;border-radius:10px;border:1.5px solid var(--line)}
.err{color:#b91c1c;font-weight:700}.okt{color:var(--ok);font-weight:800}
.quien-soy{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}.quien-soy .chip{font-size:20px;padding:14px 22px}
.crono div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
.pie{text-align:center;color:var(--soft);font-size:12px;margin-top:20px}
.p.ayuda{border:3px solid #dc2626;border-left:10px solid #dc2626;background:#fef2f2}.p.ayuda .its{color:#b91c1c}
</style>
</head>
<body>
<header><b id="tit">🎉 Personal de la fiesta</b><small id="sub">Cargando…</small></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="barra" id="barra"></div>
<script src="/fiesta-i18n.js"></script>
<script src="/fiesta-avisos.js"></script>
<script>
const t = I18N.t, tc = I18N.tc;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = new URLSearchParams(location.search), CODE = (P.get('f') || '').toUpperCase(), PK = P.get('p') || '', SK = P.get('s') || '', AYUDA = '🆘 Ayuda urgente', SEGU = '🛡 Seguridad';
const esAyuda = p => (p.items || []).some(x => x.n === AYUDA || x.n === SEGU), esSegP = p => (p.items || []).some(x => x.n === SEGU);
let F = null, PED = [], tab = 'nuevo', yo = '', conocidos = null, timer = null, herr = false;
try { yo = localStorage.getItem('fiestaYo:' + CODE) || ''; } catch (e) {}
const hace = x => { const m = Math.floor((Date.now() - Date.parse(x)) / 60000); return m < 1 ? t('recién') : t('hace {m} min', {m}); };
const tarde = p => p.estado !== 'entregado' && Date.now() - Date.parse(p.t) > 10 * 60000;
async function api(acc, body) { const r = await fetch('/api/fiesta?accion=' + acc, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({f: CODE, p: PK, s: SK}, body))}); const j = await r.json(); if (!r.ok) throw new Error(j.error || t('No se pudo')); return j; }
function sonar() { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); try { const c = new (window.AudioContext || window.webkitAudioContext)(); [0, .22].forEach(d => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 988; g.gain.value = .12; o.connect(g); g.connect(c.destination); o.start(c.currentTime + d); o.stop(c.currentTime + d + .16); }); } catch (e) {} }
async function cargar() {
  try { const r = await fetch('/api/fiesta?accion=personal&f=' + encodeURIComponent(CODE) + (SK ? '&s=' + encodeURIComponent(SK) : '&p=' + encodeURIComponent(PK))); const j = await r.json(); if (!r.ok) throw new Error(j.error || t('No se pudo abrir'));
    F = j.fiesta; PED = (j.pedidos || []).filter(p => p.estado !== 'cancelado');
    const nuevos = PED.filter(p => p.estado === 'nuevo').map(p => p.id);
    const urg = PED.some(p => p.estado === 'nuevo' && esAyuda(p) && conocidos && !conocidos.has(p.id));
    if (urg) { sonar(); setTimeout(sonar, 700); setTimeout(sonar, 1400); }
    if (conocidos && nuevos.some(id => !conocidos.has(id))) { sonar(); document.title = t('🔔 Pedido nuevo'); setTimeout(() => document.title = 'Personal · ShopEventos', 4000); }
    conocidos = new Set(PED.map(p => p.id));
    $('#tit').textContent = '🎉 ' + t(F.tipo === '15' ? 'Los 15 de {n}' : F.tipo === 'casamiento' ? 'El casamiento de {n}' : F.tipo === 'egresados' ? 'La fiesta de egresados de {n}' : 'La fiesta de {n}', {n: F.nombre});
    if (F.modoP === 'salud' || F.modoP === 'seguridad') { const sg = F.modoP === 'seguridad'; $('#tit').textContent = (sg ? '🛡 ' : '🚑 ') + (F.saludNom || (sg ? t('🛡 Seguridad').replace('🛡 ', '') : t('Servicio médico'))) + ' · ' + F.nombre; $('#sub').textContent = t('{n} pedidos de ayuda', {n: PED.filter(p => p.estado === 'nuevo').length}); pintar(); return; }
    if (F.modoP === 'barra') { $('#tit').textContent = '🍹 ' + t('Barra') + ' · ' + F.nombre; $('#sub').textContent = t('{n} pedidos para preparar', {n: PED.filter(p => p.estado === 'nuevo' && !esAyuda(p)).length}); pintar(); return; }
    $('#sub').textContent = t(F.modoP === 'mozas' ? 'Modo mozas' : 'Modo encargada') + (F.catering ? ' · ' + F.catering : '') + ' · ' + t('{n} pedidos para atender', {n: PED.filter(p => p.estado === 'nuevo').length});
    pintar();
  } catch (e) { $('#main').innerHTML = `<div class="vacio">😕 ${esc(e.message)}</div>`; $('#sub').textContent = ''; }
}
function tarjeta(p) {
  const mz = F.mozas || [], esMozas = F.modoP === 'mozas', ay = esAyuda(p);
  let b = '';
  if (F.modoP === 'barra' && !ay) { if (p.estado === 'nuevo') b = `<button class="btn azul" data-cam="${p.id}">${t('✅ Listo para retirar')}</button>`; if (p.estado === 'camino') b = `<button class="btn ok" data-ent="${p.id}">${t('🤝 Ya lo retiró')}</button>`; }
  else if (ay || F.modoP === 'salud' || F.modoP === 'seguridad') { if (p.estado === 'nuevo') b = `<button class="btn azul" data-cam="${p.id}">${esSegP(p) ? t('🚑 Voy para allá').replace('🚑', '🛡') : t('🚑 Voy para allá')}</button>`; if (p.estado === 'camino') b = `<button class="btn ok" data-ent="${p.id}">${t('✅ Atendido')}</button>`; }
  else {
  if (p.estado === 'nuevo') {
    if (esMozas) b = `<button class="btn azul" data-llevo="${p.id}">${t('🚶 Lo llevo yo')}</button>`;
    else b = mz.length ? `<div style="width:100%;font-size:14px;color:var(--soft)">${t('¿Quién lo lleva? Tocá su nombre:')}</div>` + mz.map(m => `<button class="btn azul" data-moza="${esc(m)}" data-id="${p.id}">🚶 ${esc(m)}${p.moza === m ? ' ✓' : ''}</button>`).join('') : `<button class="btn azul" data-cam="${p.id}">${t('🚶 En camino')}</button>`;
  }
  if (p.estado === 'camino') b = `<button class="btn ok" data-ent="${p.id}">${t('✅ Entregado')}</button>` + (!esMozas && mz.length > 1 ? `<details style="width:100%"><summary style="font-size:14px;color:var(--soft)">${t('Cambiar quién lo lleva')}</summary>${mz.filter(m => m !== p.moza).map(m => `<button class="chip" data-moza="${esc(m)}" data-id="${p.id}">${esc(m)}</button>`).join(' ')}</details>` : '');
  }
  return `<div class="p ${p.estado} ${ay ? 'ayuda' : ''}"><span class="hace ${tarde(p) ? 'tarde' : ''}">${hace(p.t)}${tarde(p) ? ' ⚠️' : ''}</span><div class="mesa">${F.modoP === 'barra' && !ay ? '#' + (p.id % 1000) + (p.mesa ? ' · ' + esc(p.mesa) : '') : ay && !p.mesa ? '📍 ' + esc((String(p.nota || '').split(' · ')[1] || '').trim() || '?') : t('Mesa {m}', {m: esc(p.mesa || '?')})}</div><div class="quien">${esc(p.nombre)}${p.prueba ? ' · ' + t('🧪 prueba') : ''}${p.moza ? ' · ' + t('lleva {m}', {m: esc(p.moza)}) : ''}</div>
    <div class="its">${p.items.map(x => (x.c > 1 ? x.c + ' × ' : '') + esc(tc(x.n)) + (x.p ? ` <span style="font-size:15px;font-weight:600;color:var(--soft)">· ${t('para {p}', {p: esc(x.p === 'vos' ? 'él/ella' : x.p.replace(/^tu /, 'su '))})}</span>` : '')).join('<br>')}</div>${p.nota ? `<div class="nota">📝 ${esc(p.nota)}</div>` : ''}
    <div class="btns">${b}${p.estado !== 'entregado' ? `<button class="btn alt sm" data-can="${p.id}">${t('Cancelar')}</button>` : ''}</div></div>`;
}
function pintar() {
  if (!F) return;
  const esMozas = F.modoP === 'mozas', sal = F.modoP === 'salud' || F.modoP === 'seguridad';
  if (esMozas && !yo && (F.mozas || []).length) {
    $('#tabs').innerHTML = ''; $('#barra').innerHTML = '';
    $('#main').innerHTML = `<div class="vacio"><h2>${t('¿Quién sos?')}</h2><p>${t('Tocá tu nombre para ver los pedidos.')}</p><div class="quien-soy">${F.mozas.map(m => `<button class="chip" data-yo="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>`;
    $$('[data-yo]').forEach(b => b.onclick = () => { yo = b.dataset.yo; try { localStorage.setItem('fiestaYo:' + CODE, yo); } catch (e) {} pintar(); });
    return;
  }
  const L = {nuevo: PED.filter(p => p.estado === 'nuevo'), camino: PED.filter(p => p.estado === 'camino' && (!esMozas || !yo || p.moza === yo)), entregado: PED.filter(p => p.estado === 'entregado')};
  L.nuevo.sort((a, b) => (esAyuda(b) ? 1 : 0) - (esAyuda(a) ? 1 : 0) || Date.parse(a.t) - Date.parse(b.t)); L.camino.sort((a, b) => Date.parse(a.t) - Date.parse(b.t));
  $('#tabs').innerHTML = [['nuevo', t('🔔 Para atender'), L.nuevo.length], ['camino', t(F.modoP === 'barra' ? '🍹 Listos para retirar' : esMozas ? '🚶 Los míos' : '🚶 En camino'), L.camino.length], ['entregado', t('✅ Entregados'), L.entregado.length], ['herr', t('⚙️ Herramientas'), '']].filter(x => !sal || x[0] !== 'herr').map(([k, tt, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${tt}${n !== '' ? ' (' + n + ')' : ''}</button>`).join('');
  $$('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; pintar(); });
  $('#barra').innerHTML = esMozas && yo ? `<span style="align-self:center">${t('Sos {n}', {n: '<b>' + esc(yo) + '</b>'})}</span><button class="btn alt sm" id="cambiarYo">${t('Cambiar')}</button>` : '';
  const cy = $('#cambiarYo'); if (cy) cy.onclick = () => { yo = ''; try { localStorage.removeItem('fiestaYo:' + CODE); } catch (e) {} pintar(); };
  if (tab === 'herr') return herramientas();
  const lista = L[tab] || [];
  $('#main').innerHTML = lista.length ? lista.map(tarjeta).join('') : `<div class="vacio">${tab === 'nuevo' ? t('🙌 No hay pedidos para atender.<br>Cuando llegue uno, suena y vibra.') : t('Nada por acá.')}</div>`;
  $$('[data-moza]').forEach(b => b.onclick = () => cambiar(b.dataset.id, {moza: b.dataset.moza, estado: 'camino'}));
  $$('[data-cam]').forEach(b => b.onclick = () => { const p = PED.find(x => String(x.id) === b.dataset.cam); if (F.modoP !== 'barra' && (F.mozas || []).length && !p.moza && !esAyuda(p)) return alert(t('Primero tocá el nombre de la moza que lo lleva.')); cambiar(b.dataset.cam, {estado: 'camino'}); });
  $$('[data-llevo]').forEach(b => b.onclick = () => cambiar(b.dataset.llevo, {estado: 'camino', moza: yo}));
  $$('[data-ent]').forEach(b => b.onclick = () => cambiar(b.dataset.ent, {estado: 'entregado'}));
  $$('[data-can]').forEach(b => b.onclick = () => { if (confirm(t('¿Cancelar este pedido?'))) cambiar(b.dataset.can, {estado: 'cancelado'}); });
}
async function cambiar(id, c) { const p = PED.find(x => String(x.id) === String(id)); if (p) Object.assign(p, c); pintar(); try { await api('estado', Object.assign({id}, c)); } catch (e) { alert(e.message); } cargar(); }
function herramientas() {
  const base = F.fecha ? Date.parse(F.fecha + 'T00:00:00-03:00') : 0;
  $('#main').innerHTML = `<div class="herr"><h3 style="margin-top:0">${t('🧪 Prueba antes de abrir')}</h3><p>${t('Hacé un pedido de prueba: tiene que aparecer en “Para atender” y sonar. Después marcalo como entregado.')}</p>
      <button class="btn" id="prueba">${t('🧪 Hacer pedido de prueba')}</button> <button class="btn ok" id="listo">${t('✅ Todo funciona: avisar a la familia')}</button><p id="hmsg">${F.listo ? `<span class="okt">${t('✅ Ya le avisaste a la familia que todo funciona.')}</span>` : ''}</p></div>
    ${F.abierto && F.modoP === 'barra' ? '<div class="herr" id="avisosBol"></div>' : ''}
    <div class="herr"><h3 style="margin-top:0">${t('📢 Aviso a todos los invitados')}</h3><input id="aviso" maxlength="160" placeholder="${t('Ej: 🍽 Ya sale el plato principal, vuelvan a sus mesas')}"><div class="btns"><button class="btn" id="mandar">${t('📢 Mandar aviso')}</button></div></div>
    <div class="herr"><h3 style="margin-top:0">${t('⏰ Cronograma')} ${F.atraso ? t('(atrasado {m} min)', {m: F.atraso}) : ''}</h3><div class="crono">${(F.crono || []).map(x => `<div><span>${esc(x.h)}</span><b>${esc(tc(x.t))}</b></div>`).join('') || `<p>${t('La familia todavía no cargó el cronograma.')}</p>`}</div>
      <div class="btns"><button class="btn alt sm" data-atr="15">${t('Atrasar 15 min')}</button><button class="btn alt sm" data-atr="30">${t('Atrasar 30 min')}</button><button class="btn alt sm" data-atr="-15">${t('Adelantar 15 min')}</button></div></div>
    <div class="pie">ShopEventos · Pro Video JSRHG</div>`;
  const avb = $('#avisosBol'); if (avb && window.AvisosUI) AvisosUI(avb, {code: CODE, p: PK, autor: 'barra'});
  $('#prueba').onclick = async () => { const it = (F.carta || [])[0]; if (!it) return alert(t('La familia todavía no cargó la carta.')); try { await api('pedir', {mesa: 'Prueba', items: [{n: it.n, c: 1}]}); tab = 'nuevo'; cargar(); } catch (e) { $('#hmsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; } };
  $('#listo').onclick = async () => { try { await api('listo', {}); F.listo = new Date().toISOString(); $('#hmsg').innerHTML = `<span class="okt">${t('✅ Listo, la familia ya lo ve en su panel.')}</span>`; } catch (e) { $('#hmsg').innerHTML = `<span class="err">${esc(e.message)}</span>`; } };
  $('#mandar').onclick = async () => { const tx = $('#aviso').value.trim(); if (!tx) return; try { await api('avisar', {txt: tx}); $('#aviso').value = ''; alert(t('✅ Aviso enviado a todos los invitados')); } catch (e) { alert(e.message); } };
  $$('[data-atr]').forEach(b => b.onclick = async () => { try { const j = await api('atrasar', {min: +b.dataset.atr}); F.atraso = j.atraso; herramientas(); } catch (e) { alert(e.message); } });
}
// que la pantalla no se apague mientras está abierta
async function despierta() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { despierta(); cargar(); } });
if (!CODE || !(PK || SK)) $('#main').innerHTML = `<div class="vacio">${t('Falta el link del personal. Pedíselo a la familia.')}</div>`;
$('#tit').textContent = t('🎉 Personal de la fiesta'); $('#sub').textContent = t('Cargando…'); I18N.boton('top:auto;bottom:74px');
if (!CODE || !(PK || SK)) {} else { cargar(); timer = setInterval(() => { if (tab !== 'herr') cargar(); }, 5000); despierta(); }
</script>
</body>
</html>
