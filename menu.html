.mesa + ' pide la cuenta') : '🙋 La mesa ' + a.mesa + ' llama al mozo'}${a.propina ? ' · 🎁 ' + esc(a.propina) : ''}${a.nombre ? ' (' + esc(a.nombre) + ')' : ''} · ${ago(a.creado)}</span>${a.comp ? `<a class="btn pri" href="/api/menu?id=${encodeURIComponent(ID)}&comp=${a.id}&clave=${encodeURIComponent(CLAVE)}" target="_blank" rel="noopener">🧾 Ver comprobante</a>` : ''}${a.tipo === 'pago' && a.mpOk ? `<button class="btn pri" type="button" data-v="${a.id}">🧾 Ticket hecho</button>` : a.tipo === 'pago' ? `<button class="btn pri" type="button" data-s="${a.id}|confirmado">✅ Me llegó</button><button class="btn sec" type="button" data-s="${a.id}|rechazado">❌ No me llegó</button>` : `<button class="btn sec" type="button" data-v="${a.id}">✓ Atendido</button>`}</div>`).join('');
