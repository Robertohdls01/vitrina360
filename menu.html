<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopMenu 🍽️ · El menú QR que te atiende</title>
<meta name="description" content="Sacale una foto a tu carta y la IA arma tu menú QR con un asistente que recibe a cada mesa, toma el pedido por voz y lo manda a la caja.">
<meta property="og:title" content="ShopMenu 🍽️ · El menú QR que te atiende">
<meta property="og:description" content="Una foto de tu carta y listo: cada mesa tiene un asistente que habla, recomienda y manda el pedido a la caja.">
<meta property="og:image" content="https://vitrina360app.com.ar/og-shopmenu.png">
<meta name="theme-color" content="#5b21b6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<style>
:root{--v:#6d28d9;--p:#a855f7;--o:#7c3aed;--ink:#2a1d3d;--cream:#f6f2ff;--line:#e6dcfb}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--cream);min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pri{background:linear-gradient(90deg,var(--o),var(--p));color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.3)}
.sec{background:#fff;border:2px solid var(--line);color:var(--ink)}
.note{font-size:13px;color:#6b5b86;margin:0}
.msg{color:#b91c1c;font-weight:700;margin:0}
input,textarea,select{font:inherit;border:2px solid var(--line);border-radius:12px;padding:9px 11px;background:#fff;color:inherit;width:100%}
/* ---------- dueño ---------- */
.hero{background:linear-gradient(150deg,#5b21b6,var(--o) 55%,#c084fc);color:#fff;text-align:center;padding:26px 18px 60px}
.hero .logo{font-weight:900;font-size:28px}.hero .logo small{display:block;font-size:11px;letter-spacing:2px;opacity:.85}
.hero h1{margin:14px auto 8px;font-size:clamp(28px,6.5vw,42px);line-height:1.05;max-width:680px;letter-spacing:-1px}
.hero p{margin:0 auto;max-width:560px;opacity:.95}
.wrap{max-width:760px;margin:-34px auto 0;padding:0 14px 40px;display:grid;gap:14px}
.card{background:#fff;border-radius:22px;box-shadow:0 10px 34px rgba(91,33,182,.12);padding:18px;display:grid;gap:12px}
.card h2{margin:0;font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-weight:700;font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}.thumbs img{width:76px;height:96px;object-fit:cover;border-radius:10px;border:2px solid var(--line)}
.cat{border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px}
.cat > .row input{font-weight:800}
.it{display:grid;grid-template-columns:1fr 110px auto auto;gap:6px;align-items:start}
.it textarea{grid-column:1/-1;min-height:38px;font-size:14px;padding:6px 9px}
.it .star,.it .del{border:2px solid var(--line);background:#fff;border-radius:10px;width:42px;height:42px;font-size:18px}
.it .star[aria-pressed="true"]{background:#fef3c7;border-color:#f59e0b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.links{display:grid;gap:8px}.links a{word-break:break-all;color:var(--v);font-weight:700}
.secret{background:#fef2f2;border:2px dashed #fca5a5;border-radius:14px;padding:10px;display:grid;gap:4px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.qrc{border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff;break-inside:avoid;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;aspect-ratio:2/1}.qrc svg{grid-row:1/6}.qrc .mesaN{font-size:30px;line-height:1;color:#5b21b6;font-weight:900}
.qrc svg{width:130px;height:130px}.qrc b{display:block;font-size:20px}.qrc small{display:block;color:#6b5b86;font-size:13px}
@media print{body{background:#fff}.hero,.noprint{display:none!important}.wrap{margin:0;max-width:none}.card{box-shadow:none;padding:0}.qrs{grid-template-columns:repeat(2,10cm);grid-auto-rows:5cm;gap:0;justify-content:center}.qrc{width:10cm;height:5cm;aspect-ratio:auto;border:1px dashed #999;border-radius:0;padding:3mm 4mm;box-sizing:border-box}.qrc svg{width:4cm;height:4cm}.qrc .mesaN{font-size:26pt}.qrc small{font-size:9.5pt;color:#444}.qrc b{font-size:13pt}@page{size:A4;margin:8mm}.qrs.sticker{grid-template-columns:repeat(3,6cm);grid-auto-rows:6cm}.qrs.sticker .qrc{width:6cm;height:6cm;padding:2mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}.qrs.sticker .qrc svg{width:3.6cm;height:3.6cm}.qrs.sticker .qrc .mesaN{font-size:15pt}.qrs.sticker .qrc b{font-size:9pt}.qrs.sticker .qrc small{font-size:7.5pt}.qrs.sticker .qrc img,.qrs.sticker .qrc small+small{display:none}}
.qrs.sticker{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.qrs.sticker .qrc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.qrs.sticker .qrc svg{width:120px;height:120px}.qrs.sticker .qrc img,.qrs.sticker .qrc small+small{display:none}
/* ---------- mesa (cliente) ---------- */
.mesa{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#fff 0,var(--cream) 60%)}
.mtop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#5b21b6;color:#fff}
.mtop b{font-size:18px;flex:1}.mtop .tag{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.mtop button{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;width:38px;height:38px}
.stage{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:end;padding:16px 14px 6px}
.chef{width:118px;height:162px}.chef .arm{transform-origin:84px 98px;animation:tray 3s ease-in-out infinite}@keyframes tray{50%{transform:rotate(-4deg)}}.chef.talk .mouth{animation:mouth .25s ease-in-out infinite alternate}@keyframes mouth{to{transform:scaleY(.35)}}
#cajaAsis{position:fixed;left:10px;right:10px;bottom:10px;z-index:50;display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:end;background:#fff;border:2px solid var(--line);border-radius:20px;padding:8px 10px;box-shadow:0 10px 30px rgba(91,33,182,.22)}
#cajaAsis.min{right:auto;grid-template-columns:84px;padding:4px;background:transparent;border:0;box-shadow:none}#cajaAsis.min > :not(#cAva){display:none}
#cAva{cursor:pointer}.caja{padding-bottom:240px}#cTxt{grid-column:1/-1}
@media(min-width:820px){#cajaAsis{grid-template-columns:84px minmax(0,1.3fr) minmax(240px,1fr) auto}#cTxt{grid-column:3;grid-row:1;align-self:end}#cajaAsis > div:nth-child(3){grid-column:4;grid-row:1}.caja{padding-bottom:180px}}
.wave{position:absolute;right:-6px;bottom:-4px;font-size:30px;animation:wave 1.4s ease-in-out infinite;transform-origin:70% 80%}@keyframes wave{0%,60%,100%{transform:rotate(0)}20%{transform:rotate(-22deg)}40%{transform:rotate(14deg)}}
.chef.talk{animation:talkb .35s ease-in-out infinite alternate}@keyframes talkb{to{transform:translateY(-3px) rotate(-2deg)}}.fly{position:fixed;z-index:60;pointer-events:none;transition:transform .9s cubic-bezier(.5,-0.3,.4,1.3)}.fly.back{transition:transform .8s ease-in-out}.fly .point{position:absolute;right:-26px;top:30%;font-size:30px;animation:pt .5s ease-in-out infinite alternate}@keyframes pt{to{transform:translateX(6px)}}
.flash{animation:fl 0.6s ease-in-out 5}@keyframes fl{50%{box-shadow:0 0 0 6px rgba(124,58,237,.35)}}
.chef .mouth{transform-origin:60px 70px}.chef .eyes{transform-origin:60px 52px;animation:blink 4s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.chef{animation:bob 2.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{background:#fff;border:2px solid #ddd6fe;border-radius:20px 20px 20px 6px;padding:12px 14px;font-size:17px;box-shadow:0 6px 18px rgba(91,33,182,.1);white-space:pre-line}
.opts{display:flex;gap:8px;flex-wrap:wrap;padding:6px 14px 4px}
.opts button{border:2px solid #ddd6fe;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;color:var(--ink)}
.opts button.pri{border:0}
.area{flex:1;padding:6px 14px 120px;display:grid;gap:10px;align-content:start}
.promo{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fffbeb;border:2px solid #fde68a;border-radius:16px;padding:10px 12px}
.promo b{display:block}.promo small{color:#7a5f4c}
.add{border:0;background:var(--o);color:#fff;border-radius:999px;min-width:44px;height:44px;font-size:22px;font-weight:900}
.sec2 h3{margin:10px 0 4px;font-size:18px;color:#5b21b6}
.dish{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.dish b{display:block}.dish small{display:block;color:#6b5b86}.dish .pr{font-weight:800;white-space:nowrap}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:5}
.say{display:flex;gap:8px;align-items:center}
.mic{border:0;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--o),var(--p));color:#fff;font-size:26px;flex:none;box-shadow:0 6px 16px rgba(124,58,237,.35)}
.mic.on{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(124,58,237,.15)}}
.say input{flex:1}.say .send{border:0;background:#5b21b6;color:#fff;border-radius:12px;padding:0 14px;height:44px;font-weight:800}
.cartbtn{border:0;border-radius:14px;padding:11px;background:#5b21b6;color:#fff;font-weight:800;font-size:16px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9;display:flex;align-items:flex-end}
.sheet > div{background:#fff;width:100%;max-height:85vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;display:grid;gap:10px}
.line{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:6px 0}.line span{flex:1}
.line button{border:2px solid var(--line);background:#fff;border-radius:10px;width:34px;height:34px;font-weight:900}
.startbig{display:block;width:100%;margin-top:6px;border:0;border-radius:22px;padding:22px 16px;font:900 22px system-ui;color:#fff;background:linear-gradient(90deg,var(--o),var(--p));box-shadow:0 10px 26px rgba(124,58,237,.35);animation:startp 1.6s ease-in-out infinite}@keyframes startp{50%{transform:scale(1.04)}}
.status.st-nuevo{background:#f3e8ff;border-color:#c4b5fd}.status.st-preparando{background:#fef9c3;border-color:#facc15}.status.st-listo{background:#22c55e;border-color:#16a34a;color:#fff;font-size:18px;animation:okp 1.2s ease-in-out 4}.status.st-entregado{background:#dcfce7;border-color:#86efac}@keyframes okp{50%{transform:scale(1.04)}}
.tk.preparando{border-color:#facc15;background:#fefce8}.tk.listo{border-color:#16a34a;background:#dcfce7}.tk.listo .h{color:#15803d}
.status{background:#ecfdf5;border:2px solid #86efac;border-radius:16px;padding:10px 12px;font-weight:700}
/* ---------- caja ---------- */
.caja{padding:12px;display:grid;gap:12px}
.cajatop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.col{background:#fff;border-radius:18px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px;border:2px solid var(--line)}
.col h3{margin:0;font-size:17px}
.tk{border:2px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:4px;background:#fcfaff}
.tk.nuevo{border-color:#8b5cf6;animation:glow 1.4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 5px rgba(139,92,246,.2)}}
.tk .h{display:flex;justify-content:space-between;font-weight:900}.tk ul{margin:0;padding-left:18px}
@media(max-width:600px){.lrow{grid-template-columns:1fr 1fr!important}.lrow [data-lu]{grid-column:1/-1;grid-row:2}}
.lane{min-height:0}.laneh{display:flex;justify-content:space-between;align-items:center;gap:8px}.laneh h3 span{color:#6b7280;font-size:15px}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 24px)/3);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;align-items:start}
.strip>*{scroll-snap-align:start}.strip>.note{grid-column:1/-1}
@media(max-width:900px){.strip{grid-auto-columns:calc((100% - 12px)/2)}}@media(max-width:600px){.strip{grid-auto-columns:86%}}
.arr{border:2px solid var(--line);background:#fff;border-radius:999px;width:40px;height:40px;font-size:16px;cursor:pointer;margin-left:6px}
.tk.preparando{background:#fefce8;border-color:#facc15}.tk.listo{background:#f0fdf4;border-color:#22c55e}.tk.entregado{background:#f8fafc}
.tk .est{font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;justify-self:start}.est.nuevo{background:#ede9fe;color:#6d28d9}.est.preparando{background:#fef08a;color:#854d0e}.est.listo{background:#22c55e;color:#fff}
.cnt{text-decoration:none;color:inherit;font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;cursor:pointer}
.aviso{background:#fef2f2;border:2px solid #f87171;border-radius:14px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const Q = new URLSearchParams(location.search);
  const ID = Q.get('m') || '', CLAVE = Q.get('e') || '';
  let MESA = parseInt(Q.get('mesa'), 10) || 0;
  const app = $('#app');
  const api = async (url, body) => { const r = await fetch(url, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {cache: 'no-store'}); const j = await r.json().catch(() => ({})); if(!r.ok) throw new Error(j.error || 'Algo salió mal. Probá de nuevo.'); return j; };
  const priceN = p => { let s = String(p || '').replace(/[^\d.,]/g, ''); if(!s) return 0; if(/,\d{1,2}$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/[.,]/g, ''); return Number(s) || 0; };
  const money = n => '$' + Math.round(n).toLocaleString('es-AR');
  // ---- el asistente: moza o mozo, a gusto de cada local (pelo, largo, piel, barba) ----
  const HAIR = {castano: ['#5b3420', '#4a2a17'], rubio: ['#d9a441', '#bf8a2b'], negro: ['#231c19', '#161111'], colorado: ['#b4502a', '#933f1f'], canoso: ['#c7c2bd', '#a8a29e']};
  const SKIN = {clara: ['#fde6d4', '#f3c7a7', '#f1c3a1'], media: ['#fcdcc4', '#eebc98', '#eab48e'], morena: ['#e0ac86', '#c48a62', '#bf855c'], oscura: ['#b07850', '#8a5735', '#86553a']};
  function makeAva(o){
    o = o || {}; const f = o.g !== 'mozo', H = HAIR[o.pelo] || HAIR.castano, K = SKIN[o.piel] || SKIN.media, largo = o.largo !== 'corto', id = 'sk' + Math.random().toString(36).slice(2, 7);
    const hairBack = f ? (largo ? `<path d="M33 50q-2 40 10 58l34 0q14-18 10-58q-4-26-27-27-23 1-27 27z" fill="${H[1]}"/>` : `<path d="M33 50q-3 22 3 31l48 0q6-9 3-31q-4-26-27-27-23 1-27 27z" fill="${H[1]}"/>`) : '';
    const hairFront = f ? `<path d="M36 46q0-22 24-23 24 1 24 23-6-9-14-11-8 7-26 7-5 0-8 4z" fill="${H[0]}"/><path d="M84 46q3 6 2 14l-3 1q0-8-3-13z" fill="${H[0]}"/>`
                        : `<path d="M36 47q-2-24 24-25 26 1 24 25-3-8-10-11-10 5-25 4-7 0-13 7z" fill="${H[0]}"/>`;
    const lashes = f ? '<path d="M44.2 50.6q4.8-3.6 9.6 0M66.2 50.6q4.8-3.6 9.6 0" stroke="#2a1a12" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M53.6 50.2l1.6-1.2M75.6 50.2l1.6-1.2" stroke="#2a1a12" stroke-width="1.2" stroke-linecap="round"/>' : '';
    const lips = f ? '#d9466f' : '#b4535b';
    const ear = f ? '<circle cx="36.5" cy="62" r="2" fill="#f5c84c"/><circle cx="83.5" cy="62" r="2" fill="#f5c84c"/>' : '';
    const nom = esc(String(o.local || '').trim().slice(0, 14)), fs = nom.length > 10 ? 4.2 : nom.length > 7 ? 5 : 6;
    const apron = f ? `<path d="M44 120h32l3 34q-19 4-38 0z" fill="#fff" opacity=".97"/>${nom ? `<text x="60" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="${fs}" fill="#5b21b6">${nom}</text>` : ''}` : '';
    const badge = !f && nom ? `<rect x="61" y="111" width="${Math.max(18, nom.length * fs * .62 + 6)}" height="9" rx="2" fill="#fff" stroke="#d4af37" stroke-width="1"/><text x="${61 + Math.max(18, nom.length * fs * .62 + 6) / 2}" y="117.6" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="${Math.min(fs, 5)}" fill="#5b21b6">${nom}</text>` : '';
    const barba = !f && o.barba ? `<path d="M37 58q1 25 23 25t23-25q-3 9-8 11-5-4-15-4t-15 4q-5-2-8-11z" fill="${H[0]}" opacity=".95"/><path d="M52 66q8-3 16 0" stroke="${H[0]}" stroke-width="3" fill="none" stroke-linecap="round"/>` : '';
    const brow = (o.pelo === 'canoso' || o.pelo === 'rubio') ? H[1] : '#4a2a17';
    return `<svg class="chef" viewBox="0 0 120 165" aria-hidden="true"><defs><radialGradient id="${id}" cx="45%" cy="40%" r="65%"><stop offset="0" stop-color="${K[0]}"/><stop offset="1" stop-color="${K[1]}"/></radialGradient></defs>
    <ellipse cx="60" cy="161" rx="30" ry="4" fill="rgba(0,0,0,.12)"/>${hairBack}
    <path d="M34 100q26-12 52 0l6 54q-32 8-64 0z" fill="#fff" stroke="#e5ddd3" stroke-width="2"/>
    <path d="M36 102q9-4 15-5l9 22 9-22q6 1 15 5l5 52q-15 4-29 4t-29-4z" fill="#1f2937"/>${apron}${badge}
    ${f ? '' : '<circle cx="60" cy="127" r="1.8" fill="#d4af37"/><circle cx="60" cy="137" r="1.8" fill="#d4af37"/>'}
    <path d="M51 99l9 5 9-5-9-4z" fill="#dc2626"/><path d="M49 95l11 5-11 5zM71 95l-11 5 11 5z" fill="#dc2626"/><circle cx="60" cy="100" r="2.6" fill="#991b1b"/>
    <g class="arm"><path d="M84 106q15 4 19-12" fill="none" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/><circle cx="103" cy="93" r="5" fill="${K[2]}"/>
      <ellipse cx="104" cy="88" rx="17" ry="3.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><path d="M97 86v-9h10v9z" fill="#fff" stroke="#cbd5e1"/><path d="M107 79q4 1 0 5" fill="none" stroke="#cbd5e1" stroke-width="1.5"/></g>
    <path d="M36 106q-10 14-6 32" fill="none" stroke="#1f2937" stroke-width="9" stroke-linecap="round"/><circle cx="31" cy="140" r="5" fill="${K[2]}"/>
    <rect x="53" y="78" width="14" height="18" rx="5" fill="${K[2]}"/>
    <ellipse cx="36.5" cy="57" rx="4" ry="6" fill="${K[1]}"/><ellipse cx="83.5" cy="57" rx="4" ry="6" fill="${K[1]}"/>${ear}
    <ellipse cx="60" cy="52" rx="23.5" ry="28" fill="url(#${id})"/>${hairFront}${barba}

    };
    async function load(){
      let j = null; try{ j = await api(`/api/menu?id=${ID}&clave=${encodeURIComponent(CLAVE)}&caja=1`); }catch(e){ $('#cName').textContent = '😕 ' + e.message; return; }
      MOZOS = j.mozos || []; DUENO = j.dueno || ''; 
      if(!asisInit){ asisInit = true; CGEN = j.cajaAva === 'igual' ? (j.avatar || (/a$/i.test(j.asistente || 'Lola') ? 'moza' : 'mozo')) : ''; $('#cAva').innerHTML = j.cajaAva === 'igual' ? makeAva({g: CGEN, pelo: j.pelo, largo: j.largo, piel: j.piel, barba: j.barba, local: j.nombre}).replace('class="chef"', 'class="chef" style="width:84px;height:110px"') : `<div style="position:relative;width:84px;height:84px">${(CAJA_AVAS[j.cajaAva] || CAJA_AVAS.flashi).replace('class="chef"', 'class="chef" style="width:84px;height:84px"')}<span class="wave">👋</span></div>`; if('speechSynthesis' in window) cPick(); if(DUENO) $('#cSay').innerHTML = `👋 ¡Hola, ${esc(DUENO)}! Tocá <b>🎙️</b> para que te avise de los pedidos con la voz.`;
        let visto = false; try{ visto = !!localStorage.getItem('shopmenu-tour-' + ID); }catch(e){}
        let noInst = false; try{ noInst = !!localStorage.getItem('shopmenu-noinst-' + ID); }catch(e){}
        if(visto && !yaInst && !noInst) setTimeout(() => cTalk(`📌 ${DUENO ? DUENO + ', ¿' : '¿'}querés el ícono de tu caja en esta compu? Así entrás directo, sin buscar el link.`, [['📌 Sí, ponerlo', instalarCaja, true], ['No, gracias', () => { try{ localStorage.setItem('shopmenu-noinst-' + ID, '1'); }catch(e){} cTalk('Dale. Si cambiás de idea, está el botón 📌 en Tu local.'); }]]), 1500);
        if(!visto) setTimeout(() => cTalk(`👋 ¡Hola${DUENO ? ', ' + DUENO : ''}! Es tu primera vez en la caja. ¿Querés que te muestre todo lo que tenés y dónde se cargan los links, las redes y la carta?`, [['👀 Sí, mostrame todo', () => tour(0), true], ['Ahora no', () => { try{ localStorage.setItem('shopmenu-tour-' + ID, '1'); }catch(e){} cTalk('Dale. Cuando quieras, decime "mostrame todo" o preguntame, por ejemplo: "¿dónde pongo los links?".'); }]]), 900); }
      { const prev = heard; heard = new Set((j.items || []).filter(x => x.estado === 'nuevo').map(x => x.id)); if(prev) anunciar((j.items || []).filter(x => x.estado === 'nuevo' && !prev.has(x.id)).reverse()); }
      ITEMS = j.items || []; LGc = LUGARES[j.lugar] || LUGARES.mesa;
      { const c = j.cuenta || {}, el = $('#cCuenta'), pr = '$' + Number(c.precio || 15000).toLocaleString('es-AR'); let h = '';
        if(c.estado === 'prueba') h = `<div class="aviso" style="background:#f0fdf4;border-color:#bbf7d0;flex-wrap:wrap"><span>🎁 <b>Prueba gratis:</b> te ${c.dias === 1 ? 'queda 1 día' : `quedan ${c.dias} días`}. Después son ${pr} por mes.</span><button class="btn pri" type="button" data-sus>💳 Suscribirme con Mercado Pago</button></div>`;
        else if(c.estado === 'vencido') h = `<div class="aviso" style="flex-wrap:wrap"><span>⏸️ <b>Tu prueba terminó</b> y tus mesas no pueden pedir. Suscribite por ${pr} por mes y se activa al toque.${c.mpEstado === 'pending' ? ' (Si ya pagaste, esperá unos minutos y recargá.)' : ''}</span><button class="btn pri" type="button" data-sus>💳 Suscribirme con Mercado Pago</button></div>`;
        if(el.dataset.h !== h){ el.dataset.h = h; el.innerHTML = h; } }
      if(j.nombre && j.nombre !== nombreLocal){ nombreLocal = j.nombre; $('#cName').textContent = '🧾 Caja · ' + j.nombre; }
      const its = j.items || [], ids = new Set(its.filter(x => x.estado === 'nuevo').map(x => x.id));
      if(seen && [...ids].some(id => !seen.has(id))) beep(); seen = ids;
      $('#avisos').innerHTML = its.filter(x => x.tipo === 'consulta' && x.estado === 'nuevo').map(a => `<div class="aviso" style="flex-wrap:wrap"><span style="flex-basis:100%">💬 Mesa ${a.mesa}${a.nombre ? ' (' + esc(a.nombre) + ')' : ''} pregunta · ${ago(a.creado)}<br><span style="font-weight:500">“${esc(a.texto)}”</span></span><input data-rin="${a.id}" maxlength="300" placeholder="Tu respuesta (el asistente se la dice a la mesa)" style="flex:1"><button class="btn pri" type="button" data-r="${a.id}">Responder</button></div>`).join('') + its.filter(x => x.tipo !== 'pedido' && x.tipo !== 'consulta' && x.estado === 'nuevo').map(a => `<div class="aviso"><span>${a.tipo === 'pago' ? '💰 La mesa ' + a.mesa + ' dice que PAGÓ VIRTUAL ' + esc(a.monto || '') + (a.pedido_n ? ' (pedido #' + a.pedido_n + ')' : '') + ' — revisá que te haya llegado' : a.tipo === 'cuenta' ? (a.metodo === 'efectivo' ? '💵 La mesa ' + a.mesa + ' paga EN EFECTIVO ' + esc(a.monto || '') + ': mandá al mozo a cobrar' : a.metodo === 'caja' ? '🧾 La mesa ' + a.mesa + ' va a pagar EN LA CAJA ' + esc(a.monto || '') : '💳 La mesa ' + a.mesa + ' pide la cuenta') : '🙋 La mesa ' + a.mesa + ' llama al mozo'}${a.propina ? ' · 🎁 ' + esc(a.propina) : ''}${a.nombre ? ' (' + esc(a.nombre) + ')' : ''} · ${ago(a.creado)}</span><button class="btn sec" type="button" data-v="${a.id}">✓ Atendido</button></div>`).join('');
      const peds = its.filter(x => x.tipo === 'pedido').sort((a, b) => String(a.creado).localeCompare(String(b.creado)));
      const ACC = {
        nuevo: p => `<button class="btn pri" type="button" data-s="${p.id}|preparando">👨‍🍳 Preparar</button><button class="btn sec" type="button" data-s="${p.id}|cancelado" aria-label="Cancelar">✕</button>`,
        preparando: p => `${MOZOS.length ? `<select data-mz="${p.id}" aria-label="Quién lo lleva (opcional)" style="width:auto"><option value="">¿Quién lo lleva?</option>${MOZOS.map(m => `<option>${esc(m)}</option>`).join('')}</select>` : ''}<button class="btn pri" type="button" data-s="${p.id}|listo">✅ Listo</button>`,
        listo: p => `${p.mozo ? `<span>🧑‍🍳 Lo lleva <b>${esc(p.mozo)}</b></span>` : ''}<button class="btn pri" type="button" data-s="${p.id}|entregado">🍽️ Entregado</button>`};
      const pend = peds.filter(p => ACC[p.estado]), hoy = Date.now() - 16 * 3600e3;
      const ent = peds.filter(p => p.estado === 'entregado' && Date.parse(p.creado) > hoy).reverse();
      const put = (id, html) => { const el = $('#' + id); if(el.dataset.h === html) return; const x = el.scrollLeft; el.dataset.h = html; el.innerHTML = html; el.style.scrollBehavior = 'auto'; el.scrollLeft = x; el.style.scrollBehavior = ''; };
      put('cPend', pend.map(p => tk(p, ACC[p.estado](p))).join('') || '<p class="note">🎉 No tenés pedidos pendientes.</p>');
      put('cE', ent.map(p => tk(p, p.mozo ? `<span>🧑‍🍳 Lo llevó <b>${esc(p.mozo)}</b></span>` : '')).join('') || '<p class="note">Todavía no entregaste pedidos hoy.</p>');
      $('#cPn').textContent = `(${pend.length})`; $('#cEn').textContent = `(${ent.length})`;
      const c = k => pend.filter(p => p.estado === k).length;
      put('cCnt', [['nuevo', '🆕', 'nuevos'], ['preparando', '👨‍🍳', 'preparando'], ['listo', '✅', 'listos']].filter(([k]) => c(k)).map(([k, e, t]) => `<button class="cnt" type="button" data-go="${k}">${e} ${c(k)} ${t}</button>`).join(''));
    }
    function irA(est){ const st = $('#cPend'), el = st && st.querySelector('.tk.' + est); if(el) st.scrollTo({left: el.offsetLeft - st.offsetLeft, behavior: 'smooth'}); }
    app.addEventListener('click', e => { const ar = e.target.closest('[data-arr]'); if(ar){ const [id, d] = ar.dataset.arr.split('|'), el = $('#' + id); el.scrollBy({left: d * el.clientWidth, behavior: 'smooth'}); return; } const g = e.target.closest('[data-go]'); if(g) return irA(g.dataset.go); const s = e.target.closest('[data-s]'); if(s){ const [pid, est] = s.dataset.s.split('|'); set(pid, est); } const v = e.target.closest('[data-v]'); if(v) set(v.dataset.v, 'visto');
      const r = e.target.closest('[data-r]'); if(r){ const inp = app.querySelector(`[data-rin="${r.dataset.r}"]`), rta = inp && inp.value.trim(); if(!rta){ inp && inp.focus(); return; } api('/api/menu?accion=estado', {id: ID, clave: CLAVE, pid: r.dataset.r, estado: 'respondido', rta}).then(load, e2 => alert(e2.message)); } });
    const loadRev = async () => { try{ const r = await api(`/api/menu?id=${ID}&clave=${encodeURIComponent(CLAVE)}&resenas=1`); $('#rev summary').textContent = r.n ? `⭐ ${String(r.prom).replace('.', ',')} · ${r.n} opiniones de tus clientes` : '⭐ Opiniones de tus clientes (todavía ninguna)'; $('#revL').innerHTML = r.items.map(x => `<div><b style="color:#f59e0b">${'★'.repeat(x.e)}${'☆'.repeat(5 - x.e)}</b> ${esc(x.nombre)} · mesa ${x.mesa}${x.tx ? `<br><span>${esc(x.tx)}</span>` : ''}</div>`).join('') || '<p class="note">Aparecen acá cuando tus clientes califiquen al pagar.</p>'; }catch(e){} };
    loadRev(); setInterval(loadRev, 60000);
    load(); setInterval(() => { const f = document.activeElement; if(f && f.matches && (f.matches('[data-rin]') && f.value || f.matches('[data-mz]'))) return; load(); }, 5000);
  }
})();
