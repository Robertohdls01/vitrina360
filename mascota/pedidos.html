<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pedidos Siempre Conmigo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%2064%2064%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Cg%20fill%3D%22%235f8f66%22%3E%3Cellipse%20cx%3D%2214%22%20cy%3D%2226%22%20rx%3D%227%22%20ry%3D%229%22%20transform%3D%22rotate%28-20%2014%2026%29%22/%3E%3Cellipse%20cx%3D%2226%22%20cy%3D%2214%22%20rx%3D%227%22%20ry%3D%229%22%20transform%3D%22rotate%28-6%2026%2014%29%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2214%22%20rx%3D%227%22%20ry%3D%229%22%20transform%3D%22rotate%286%2040%2014%29%22/%3E%3Cellipse%20cx%3D%2251%22%20cy%3D%2226%22%20rx%3D%227%22%20ry%3D%229%22%20transform%3D%22rotate%2820%2051%2026%29%22/%3E%3C/g%3E%3Cpath%20d%3D%22M32.5%2058%20C%2030%2055%2C%2015%2046%2C%2015%2036%20C%2015%2029.5%2C%2020%2026%2C%2024.5%2026%20C%2028%2026%2C%2031%2028%2C%2032.5%2031%20C%2034%2028%2C%2037%2026%2C%2040.5%2026%20C%2045%2026%2C%2050%2029.5%2C%2050%2036%20C%2050%2046%2C%2035%2055%2C%2032.5%2058%20Z%22%20fill%3D%22%23e08e86%22/%3E%3C/svg%3E">
<style>
:root { --bg: #eef3ec; --surface: #f8fbf6; --line: #d3dfd0; --ink: #2e3a30; --muted: #5f7062; --accent: #5f8f66; --accent-soft: #dcebdc; --warn: #b8743a; }
@media (prefers-color-scheme: dark) { :root { --bg: #171e19; --surface: #1f2822; --line: #33413a; --ink: #e2eadf; --muted: #a3b6a6; --accent: #8dbb93; --accent-soft: #2a3a2e; --warn: #d9a26c; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 1.6rem; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.top b { font-size: 1.15rem; }
.pill { font-size: .8rem; font-weight: 700; border-radius: 99px; padding: 2px 10px; border: 1px solid var(--line); }
.pill.pagado { background: var(--accent-soft); border-color: var(--accent); }
.pill.sin { color: var(--warn); border-color: var(--warn); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.files a { font-size: .85rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; color: var(--ink); text-decoration: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input, select, button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
input { flex: 1; min-width: 180px; }
button { cursor: pointer; font-weight: 700; }
.cuenta { white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: .92rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pedidos de Siempre Conmigo</h1>
  <p class="muted" id="msg">Cargando…</p>
  <div id="lista" class="wrap" style="gap:12px"></div>
</div>
<script>
(function () {
  let tok = ''; try { tok = (JSON.parse(localStorage.getItem('v360-sesion') || 'null') || {}).access_token || ''; } catch (e) {}
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fecha = (s) => s ? new Date(s).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '';
  const ESTADOS = { nuevo: 'Nuevo', en_proceso: 'Lo estoy armando', entregado: 'Entregado' };
  function cargar() {
    if (!tok) { document.getElementById('msg').innerHTML = 'Primero entrá a tu <a href="/panel">panel</a> con tu mail, y después volvé a esta página.'; return; }
    fetch('/api/mascota?accion=admin', { headers: { Authorization: 'Bearer ' + tok } }).then((r) => r.json().then((j) => ({ ok: r.ok, j }))).then(({ ok, j }) => {
      const msg = document.getElementById('msg');
      if (!ok) { msg.textContent = j.error || 'No se pudieron cargar los pedidos.'; return; }
      const ps = j.pedidos || [];
      const pagos = ps.filter((p) => p.pagado).length;
      msg.textContent = ps.length ? ps.length + ' pedidos · ' + pagos + ' pagados · precios: propia $' + Number(j.precio).toLocaleString('es-AR') + ', catálogo $' + Number(j.precio_generica).toLocaleString('es-AR') : 'Todavía no hay pedidos.';
      document.getElementById('lista').innerHTML = ps.map((p) => {
        const wa = String(p.whatsapp || '').replace(/\D/g, '');
        return '<div class="card" data-id="' + esc(p.id) + '">' +
          '<div class="top"><b>' + esc(p.mascota) + ' <span class="muted">(' + (p.tipo === 'generica' ? 'de catálogo: ' + esc(p.elegida) : esc(p.especie)) + ', ' + esc(p.caracter) + ')</span></b>' +
          '<span class="pill ' + (p.pagado ? 'pagado' : 'sin') + '">' + (p.pagado ? 'Pagado' : 'Sin pagar') + '</span></div>' +
          '<div class="muted">' + fecha(p.creado) + ' · ' + esc(p.nombre) + ' · te dice “' + esc(p.apodo || '—') + '”</div>' +
          '<div>WhatsApp: <b>' + esc(p.whatsapp) + '</b> · Mail: ' + esc(p.email) + (wa ? ' · <a href="https://wa.me/' + (wa.startsWith('54') ? wa : '54' + wa) + '" target="_blank" rel="noopener">Abrir WhatsApp</a>' : '') + '</div>' +
          (p.cuenta ? '<div class="cuenta">' + esc(p.cuenta) + '</div>' : '') +
          '<div class="files">' + (p.archivos || []).map((a) => a.url ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.nombre) + '</a>' : '').join('') + (p.archivos && p.archivos.length ? '' : '<span class="muted">Sin fotos</span>') + '</div>' +
          '<div class="row"><select class="estado">' + Object.keys(ESTADOS).map((k) => '<option value="' + k + '"' + (p.estado === k ? ' selected' : '') + '>' + ESTADOS[k] + '</option>').join('') + '</select>' +
          '<input class="link" placeholder="Link de su casa para mandarle" value="' + esc(p.link || '') + '">' +
          (p.pagado ? '' : '<label class="muted"><input type="checkbox" class="pago" style="min-width:0;flex:0"> Me pagó por otro lado</label>') +
          '<button type="button" class="guardar">Guardar</button></div></div>';
      }).join('');
      document.querySelectorAll('.guardar').forEach((b) => b.onclick = () => {
        const c = b.closest('.card'), pago = c.querySelector('.pago');
        b.textContent = 'Guardando…';
        fetch('/api/mascota?accion=marcar', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({ id: c.dataset.id, estado: c.querySelector('.estado').value, link: c.querySelector('.link').value, pagado: pago ? pago.checked : undefined }) })
          .then((r) => { b.textContent = r.ok ? 'Guardado' : 'No se pudo'; if (r.ok && pago && pago.checked) cargar(); });
      });
    }).catch(() => { document.getElementById('msg').textContent = 'No se pudieron cargar los pedidos. Probá de nuevo.'; });
  }
  cargar();
})();
</script>
</body>
</html>
