<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="color-scheme" content="light only">
<style>:root{color-scheme:light only}</style><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folleto para dejar en el local · ShopMenu / ShopFlash</title>
<meta name="robots" content="noindex">
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box}
body{margin:0;font:13pt/1.5 Arial,Helvetica,sans-serif;color:#2a1d3d;background:#f4f1fa}
.ctl{max-width:820px;margin:14px auto;background:#fff;border:2px solid #e6dcfb;border-radius:16px;padding:14px;display:grid;gap:10px}
.ctl h1{margin:0;font-size:18px}
.ctl .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.ctl label{display:grid;gap:4px;font-weight:700;font-size:14px}
.ctl input,.ctl select{font:inherit;padding:8px 10px;border:2px solid #e6dcfb;border-radius:10px}
.ctl button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 18px;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;cursor:pointer}
.ctl small{color:#6b5b86}
.hoja{width:210mm;min-height:297mm;margin:0 auto 20px;background:#fff;padding:14mm;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.cab{background:#f3eeff;border:1.5px solid #e6dcfb;border-radius:14px;padding:12px 16px}
.cab h2{margin:0;font-size:24pt;color:#5b21b6}
.cab p{margin:4px 0 0;font-size:12.5pt}
h3{color:#5b21b6;margin:14px 0 4px;font-size:13.5pt;border-bottom:1.5px solid #e6dcfb;padding-bottom:2px}
ol{margin:4px 0;padding-left:22px}
li{margin:7px 0}
li b{color:#4c1d95}
.pie{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:14px;border:2px dashed #c4b5fd;border-radius:14px;padding:12px}
.pie .qr{width:42mm;height:42mm}
.pie .qr svg{width:100%;height:100%}
.pie big{font-size:15pt;font-weight:800;color:#5b21b6;display:block}
.linea{border-bottom:1.5px solid #999;display:inline-block;min-width:60mm;height:18px}
.precio{background:#fffde7;border:1px solid #fff59d;border-radius:10px;padding:8px 12px;margin-top:10px}
@media print{body{background:#fff}.ctl{display:none}.hoja{box-shadow:none;margin:0;padding:0;width:auto;min-height:0}}
</style></head><body>
<div class="ctl">
  <h1>🖨 Folleto para dejar en el local</h1>
  <small>Para cuando el dueño no está: completá tus datos, imprimí y dejá la hoja. Tus datos no se guardan en ningún lado.</small>
  <div class="row">
    <label>Producto<select id="cP"><option value="menu">ShopMenu (cafés, bares, restaurantes)</option><option value="flash">ShopFlash (tienda online)</option></select></label>
    <label>Tu nombre<input id="cN" placeholder="Ej: Roberto" maxlength="30"></label>
    <label>Tu WhatsApp<input id="cW" placeholder="Ej: 223 555 1234" maxlength="20" inputmode="tel"></label>
    <button type="button" onclick="print()">🖨 Imprimir</button>
  </div>
</div>
<div class="hoja" id="hoja"></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const P = {
  menu: { t: 'ShopMenu 🍽️', s: 'Un menú QR con una moza virtual que atiende tus mesas: saluda, toma el pedido hablando y lo manda directo a tu caja.', url: '/shopmenu',
    items: [
      ['Tus mozos ahorran tiempo', 'ya no van a la mesa a tomar el pedido: solo llevan lo que está pedido.'],
      ['Todo ordenado', 'cada pedido llega numerado y con la hora; primero se atiende al que pidió primero.'],
      ['Sin errores', 'el pedido llega escrito, sin confusiones.'],
      ['Aviso con sonido', 'cada pedido nuevo suena en tu caja y un ayudante te lo dice en voz alta.'],
      ['Vendés más', 'la moza recomienda y ofrece algo más, como un buen mozo.'],
      ['Cobro en la mesa', 'tus clientes pagan con alias o Mercado Pago, y dejan propina si quieren.'],
      ['Más reseñas en Google', 'al terminar, la moza pide una opinión y manda al cliente a Google.'],
      ['Tu carta siempre al día', 'cambiás un precio y el QR sigue siendo el mismo.'],
      ['Clientes fijos', 'lo instalan como app, piden "lo de siempre" y pueden pedir para llevar.'],
      ['Turistas', 'la carta y la moza en 8 idiomas: español, inglés, portugués, francés, italiano, alemán, ruso y chino.'],
      ['No cambia tu sistema', 'es un complemento: seguís facturando como siempre.']],
    precio: '<b>$15.000 por mes</b> · sin permanencia · <b>7 días de prueba gratis</b>' },
  flash: { t: 'ShopFlash ⚡', s: 'Tu tienda online con vitrinas, lista en menos de 10 minutos subiendo fotos de tus productos.', url: '/',
    items: [
      ['Súper rápida', 'subís decenas de productos con fotos en pocos minutos; la IA reconoce y completa.'],
      ['Lista en menos de 10 minutos', 'sin saber de computación.'],
      ['Vitrinas por rubro', 'lindas y fáciles de recorrer desde el celular.'],
      ['Vendés por unidad, kilo o docena', 'ideal para verdulerías, panaderías y fiambrerías.'],
      ['Modo comida', 'pizzerías y casas de comida reciben pedidos ordenados.'],
      ['Cobrás con Mercado Pago', 'y recibís los pedidos por WhatsApp.'],
      ['Tu link y tu QR', 'para compartir en redes, en la vidriera o en el mostrador.'],
      ['Asistente que te guía', 'te muestra cómo hacer cada cosa.'],
      ['Todo en una pantalla', 'tienda, WhatsApp e Instagram juntos en la compu.'],
      ['En 8 idiomas', 'para vender también afuera.']],
    precio: 'Desde <b>$7.500 por mes</b> · <b>7 días de prueba gratis</b>' } };
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
function pinta(){
  const p = P[document.getElementById('cP').value], n = document.getElementById('cN').value.trim(), w = document.getElementById('cW').value.trim(), url = location.origin + p.url;
  let qr = ''; try{ const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({cellSize: 5, margin: 1, scalable: true}); }catch(e){}
  document.getElementById('hoja').innerHTML = `<div class="cab"><h2>${p.t}</h2><p>${p.s}</p></div>
    <h3>Por qué te conviene</h3><ol>${p.items.map(([a, b]) => `<li><b>${a}:</b> ${b}</li>`).join('')}</ol>
    <div class="precio">${p.precio}</div>
    <div class="pie"><div class="qr">${qr}</div><div><big>Probalo ahora desde tu celular</big>Escaneá el código o entrá a <b>${esc(url.replace(/^https?:\/\//, ''))}</b><br><br>
      ¿Te interesa? Escribime y te lo dejo funcionando:<br><b>${n ? esc(n) : '<span class="linea"></span>'}</b> · WhatsApp: <b>${w ? esc(w) : '<span class="linea"></span>'}</b></div></div>`;
}
['cP', 'cN', 'cW'].forEach(id => document.getElementById(id).addEventListener('input', pinta));
const Q = new URLSearchParams(location.search); if(Q.get('p') === 'flash') document.getElementById('cP').value = 'flash';
pinta();
</script>
</body></html>
